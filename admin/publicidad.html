<script>
const SB_URL = 'https://glscnwctcvrosmbrljns.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdsc2Nud2N0Y3Zyb3NtYnJsam5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTcyNjksImV4cCI6MjA5MjYzMzI2OX0.coUfdaThWGrwV8w-MixbWYfgidoi_q_60Y-3KinfeFw';
const ADMIN_EMAIL = 'kirolorik.app@gmail.com';

let authToken = null;
let authUser = null;

// ── SESIÓN (misma que el panel: el token se renueva solo y, si la sesión ya no existe, vuelve al login) ──
var _fetchOriginal=window.fetch.bind(window);
var refrescando=null;
function jwtExp(t){
  try{ return JSON.parse(atob(String(t).split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000; }catch(e){ return 0; }
}
function refrescarSesion(){
  if(refrescando) return refrescando;
  refrescando=KBS.lock('kb_admin_refresh',function(){
    var tk=KBS.get('kb_admin_token');
    if(tk&&tk!==authToken&&jwtExp(tk)-Date.now()>60000){ authToken=tk; return true; }
    var rt=KBS.get('kb_admin_refresh');
    if(!rt) return false;
    return _fetchOriginal(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})
    }).then(function(r){return r.ok?r.json():null}).then(function(d){
      if(!d||!d.access_token) return false;
      authToken=d.access_token;
      KBS.set('kb_admin_token',authToken);
      if(d.refresh_token) KBS.set('kb_admin_refresh',d.refresh_token);
      return true;
    });
  }).catch(function(){return false}).then(function(ok){refrescando=null;return ok;});
  return refrescando;
}
window.fetch=function(url,opts){
  return _fetchOriginal(url,opts).then(function(res){
    if(res.status!==401||!authToken||typeof url!=='string'||url.indexOf(SB_URL)!==0||url.indexOf('/auth/v1/')>=0) return res;
    return refrescarSesion().then(function(ok){
      if(!ok){ sesionCaducada(); return res; }
      var o=Object.assign({},opts||{});
      o.headers=Object.assign({},o.headers||{},{'Authorization':'Bearer '+authToken});
      return _fetchOriginal(url,o);
    });
  });
};
function renovarSiHaceFalta(){ if(authToken&&jwtExp(authToken)-Date.now()<5*60000) refrescarSesion(); }
setInterval(renovarSiHaceFalta,60000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) renovarSiHaceFalta(); });
function sesionCaducada(){
  KBS.clear('kb_admin');
  authToken=null; authUser=null;
  document.getElementById('adminScreen').style.display='none';
  document.getElementById('deniedScreen').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginError').textContent='La sesión ha caducado. Entra de nuevo.';
}

function H(){ return {'apikey':SB_KEY,'Authorization':'Bearer '+(authToken||SB_KEY),'Content-Type':'application/json'}; }
function toast(msg,err){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show'+(err?' error':'');
  setTimeout(function(){t.className='toast'},3500);
}
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function norm(s){
  return String(s||'').toLowerCase().replace(/[áàäâ]/g,'a').replace(/[éèëê]/g,'e').replace(/[íìïî]/g,'i').replace(/[óòöô]/g,'o').replace(/[úùüû]/g,'u').replace(/ñ/g,'n').replace(/[^a-z0-9]/g,'');
}

async function login(){
  var email=document.getElementById('loginEmail').value.trim();
  var pass=document.getElementById('loginPass').value;
  var err=document.getElementById('loginError');
  var btn=document.getElementById('loginBtn');
  err.textContent='';btn.disabled=true;btn.textContent='...';
  try{
    var res=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:email,password:pass})
    });
    var data=await res.json();
    if(!res.ok) throw new Error(data.error_description||'Error');
    if(data.user.email!==ADMIN_EMAIL) throw new Error('Esta cuenta no tiene permisos de administrador');
    authToken=data.access_token;
    authUser=data.user;
    KBS.setPersist(!!(document.getElementById('loginRecordar')||{checked:true}).checked,'kb_admin');
    KBS.set('kb_admin_token',authToken);
    KBS.set('kb_admin_user',JSON.stringify(authUser));
    if(data.refresh_token) KBS.set('kb_admin_refresh',data.refresh_token);
    mostrarAdmin();
  }catch(e){
    err.textContent=e.message;
    btn.disabled=false;btn.textContent='Entrar';
  }
}
function mostrarAdmin(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('deniedScreen').style.display='none';
  document.getElementById('adminScreen').style.display='block';
  cargarTodo();
}

}

// ── DATOS ──
let ANUN=[], BAN=[], COL=[], MUN=[], TIPOS=[], MET=[], TARIFAS=[];
let ANUN_BY={}, BAN_BY={}, COL_BY={}, MUN_BY={}, TIPO_BY={}, MET_BY={};
let periodoDias=30;
let tabActual='banners';

// Supabase devuelve como mucho 1000 filas por petición: se pide por páginas
async function getAll(path){
  var out=[], from=0, paso=1000, sep=path.indexOf('?')>=0?'&':'?';
  for(;;){
    var res=await fetch(SB_URL+'/rest/v1/'+path+sep+'limit='+paso+'&offset='+from,{headers:H()});
    var d=await res.json();
    if(!res.ok||!Array.isArray(d)) throw new Error((d&&d.message)||'Error al cargar');
    out=out.concat(d);
    if(d.length<paso) break;
    from+=paso;
  }
  return out;
}
function indexar(lista,clave){ var m={}; lista.forEach(function(x){m[x[clave]]=x}); return m; }

async function cargarTodo(){
  try{
    var r=await Promise.all([
      getAll('anunciantes?select=*&order=created_at.asc'),
      getAll('banners?select=*&order=created_at.asc'),
      getAll('colocaciones?select=*&order=created_at.desc'),
      getAll('municipios?select=id,nombre,provincia&activo=eq.true&order=orden.asc'),
      getAll('tipos_negocio?select=*&order=orden.asc'),
      getAll('banner_metricas_diarias?select=*&order=fecha.asc'),
      getAll('tarifas?select=id,plan,precio,periodo&order=precio.asc')
    ]);
    ANUN=r[0]; BAN=r[1]; COL=r[2]; MUN=r[3]; TIPOS=r[4]; MET=r[5]; TARIFAS=r[6];
    ANUN_BY=indexar(ANUN,'id'); BAN_BY=indexar(BAN,'id'); COL_BY=indexar(COL,'id'); MUN_BY=indexar(MUN,'id'); TIPO_BY=indexar(TIPOS,'id');
    MET_BY={}; MET.forEach(function(m){ (MET_BY[m.colocacion_id]=MET_BY[m.colocacion_id]||[]).push(m); });
    rellenarFiltros();
    renderTodo();
  }catch(e){
    document.getElementById('bannersList').innerHTML='<div class="empty-slot" style="color:#dc2626">Error al cargar: '+esc(e.message)+'</div>';
  }
}
function renderTodo(){ renderBanners(); renderAnun(); renderMetricas(); }

function cambiarTab(t){
  tabActual=t;
  [['banners','tabBanners','tabBtnBanners'],['anun','tabAnun','tabBtnAnun'],['met','tabMet','tabBtnMet']].forEach(function(x){
    document.getElementById(x[1]).style.display=(x[0]===t?'block':'none');
    document.getElementById(x[2]).classList.toggle('active',x[0]===t);
  });
}

// ── UTILIDADES ──
function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtF(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0].slice(2); }
function nombrePueblo(c){ return c.municipio_id?(MUN_BY[c.municipio_id]?MUN_BY[c.municipio_id].nombre:'(pueblo borrado)'):'Todos los pueblos'; }

const ESTADOS={
  activa:{t:'Activa'}, programada:{t:'Programada'}, finalizada:{t:'Finalizada'}, pausada:{t:'Pausada'},
  pendiente_pago:{t:'Pendiente de pago'}, revision:{t:'En revisión'}, borrador:{t:'Borrador'}, rechazada:{t:'Rechazada'}, cancelada:{t:'Cancelada'}, sin:{t:'Sin colocación'}
};
// Estados que se guardan (el visible de «confirmada» depende de las fechas)
const ESTADOS_BD={borrador:'Borrador',revision:'En revisión',rechazada:'Rechazada',pendiente_pago:'Pendiente de pago',confirmada:'Confirmada (activa según fechas)',pausada:'Pausada',cancelada:'Cancelada'};
const ORIGENES={pago:'Pago',cortesia:'Cortesía',acuerdo:'Acuerdo'};
const RENOVACION={prepago:'Prepago',automatica:'Renovación automática'};

// Estado que se muestra: «confirmada» se desglosa según las fechas
function estadoVisible(c){
  if(c.estado!=='confirmada') return c.estado;
  var hoy=hoyISO();
  if(c.fecha_inicio>hoy) return 'programada';
  if(c.fecha_fin&&c.fecha_fin<hoy) return 'finalizada';
  return 'activa';
}
function sumar(filas,desde){
  var t={v:0,a:0,c:0};
  (filas||[]).forEach(function(m){ if(!desde||m.fecha>=desde){ t.v+=m.vistas||0; t.a+=m.aperturas||0; t.c+=m.clics||0; } });
  return t;
}
function ctr(t){ return t.v>0?(t.c*100/t.v).toFixed(1)+'%':'—'; }

function filasBanners(){
  var filas=COL.map(function(c){ return {col:c, ban:BAN_BY[c.banner_id]}; }).filter(function(f){return f.ban});
  BAN.forEach(function(b){ if(!COL.some(function(c){return c.banner_id===b.id})) filas.push({col:null,ban:b}); });
  return filas;
}

function renderBanners(){
  var q=document.getElementById('fb_q').value;
  var fa=document.getElementById('fb_anun').value, fm=document.getElementById('fb_mun').value, fe=document.getElementById('fb_estado').value;
  var palabras=String(q).split(/\s+/).map(norm).filter(Boolean);
  var filas=filasBanners().filter(function(f){
    var a=ANUN_BY[f.ban.anunciante_id];
    if(fa&&f.ban.anunciante_id!==fa) return false;
    if(fm==='_todos'&&!(f.col&&!f.col.municipio_id)) return false;
    if(fm&&fm!=='_todos'&&!(f.col&&f.col.municipio_id===fm)) return false;
    var est=f.col?estadoVisible(f.col):'sin';
    if(fe&&est!==fe) return false;
    if(palabras.length){
      var texto=norm([f.ban.nombre,f.ban.descripcion,a?a.nombre:'',a?a.codigo:'',f.col?nombrePueblo(f.col):''].join(' '));
      for(var i=0;i<palabras.length;i++) if(texto.indexOf(palabras[i])<0) return false;
    }
    return true;
  });
  var orden={activa:0,programada:1,pendiente_pago:2,revision:3,borrador:4,pausada:5,finalizada:6,cancelada:7,rechazada:8,sin:9};
  filas.sort(function(x,y){
    var ex=x.col?estadoVisible(x.col):'sin', ey=y.col?estadoVisible(y.col):'sin';
    return (orden[ex]-orden[ey])||String(y.col?y.col.created_at:y.ban.created_at).localeCompare(String(x.col?x.col.created_at:x.ban.created_at));
  });
  var total=filasBanners().length;
  document.getElementById('fb_count').textContent=(q||fa||fm||fe)?(filas.length+' de '+total+' filas'):(total+' fila'+(total===1?'':'s'));
  var cont=document.getElementById('bannersList');
  if(!total){cont.innerHTML='<div class="empty-slot">Aún no hay banners. Crea el primero con «Nuevo banner».</div>';return;}
  if(!filas.length){cont.innerHTML='<div class="empty-slot">Ninguna fila coincide con el filtro</div>';return;}
  cont.innerHTML=filas.map(function(f){
    var b=f.ban, c=f.col, a=ANUN_BY[b.anunciante_id], est=c?estadoVisible(c):'sin';
    var tn=a&&a.tipo_negocio&&TIPO_BY[a.tipo_negocio]?TIPO_BY[a.tipo_negocio].nombre:'';
    var t=c?sumar(MET_BY[c.id]):{v:0,a:0,c:0};
    var lineaFechas=c?('📍 '+esc(nombrePueblo(c))+' · 📅 '+fmtF(c.fecha_inicio)+' → '+(c.fecha_fin?fmtF(c.fecha_fin):'sin fin')):'Este banner aún no tiene pueblos ni fechas';
    var tags=c?('<span class="tag">'+esc(ORIGENES[c.origen]||c.origen)+'</span><span class="tag">'+esc(RENOVACION[c.modo_renovacion]||c.modo_renovacion)+'</span>'+(b.activo?'':'<span class="tag">Banner oculto</span>')):(b.activo?'':'<span class="tag">Banner oculto</span>');
    var acts='';
    if(c){
      acts+='<button data-act="edit-col" data-id="'+esc(c.id)+'">✏️ Colocación</button>';
      if(c.estado==='confirmada') acts+='<button data-act="pausar" data-id="'+esc(c.id)+'">⏸ Pausar</button>';
      if(c.estado==='pausada') acts+='<button data-act="reanudar" data-id="'+esc(c.id)+'">▶ Reanudar</button>';
      if(c.estado==='revision'||c.estado==='borrador'||c.estado==='pendiente_pago') acts+='<button data-act="confirmar" data-id="'+esc(c.id)+'">✅ Confirmar</button>';
      acts+='<button data-act="metricas-col" data-id="'+esc(c.id)+'">📈 Métricas</button>';
    }
    acts+='<button data-act="edit-banner" data-id="'+esc(b.id)+'">🖼 Banner</button>';
    acts+='<button data-act="add-col" data-id="'+esc(b.id)+'">＋ Pueblos</button>';
    if(c&&c.estado!=='cancelada') acts+='<button class="danger" data-act="cancelar" data-id="'+esc(c.id)+'">Cancelar</button>';
    return '<div class="pc-card"><div class="pc-top"><div class="pc-main"><div class="pc-title">'+esc(b.nombre)+'</div>'
      +'<div class="pc-sub"><span class="cod">'+esc(a?a.codigo:'')+'</span> '+esc(a?a.nombre:'(sin anunciante)')+(tn?' · '+esc(tn):'')+'</div></div>'
      +'<span class="badge st-'+est+'">'+esc(ESTADOS[est].t)+'</span></div>'
      +'<div class="pc-line">'+lineaFechas+'</div>'+(tags?'<div class="pc-line">'+tags+'</div>':'')
      +(c?'<div class="pc-metrics"><span>👁 <b>'+t.v+'</b></span><span>📖 <b>'+t.a+'</b></span><span>👆 <b>'+t.c+'</b></span><span>CTR <b>'+ctr(t)+'</b></span></div>':'')
      +(c&&c.motivo_rechazo?'<div class="pc-line" style="color:#dc2626">Motivo: '+esc(c.motivo_rechazo)+'</div>':'')

  }).join('');

// ── MÉTRICAS ──
function desdePeriodo(){
  if(!periodoDias) return '';
  var d=new Date(); d.setDate(d.getDate()-(periodoDias-1));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function filaRank(nombre,meta,t){
  return '<div class="rank-row"><div><div class="rank-name">'+esc(nombre)+'</div><div class="rank-meta">'+esc(meta)+'</div></div><div class="rank-value">👆 '+t.c+' · CTR '+ctr(t)+'<div class="rank-meta">👁 '+t.v+' · 📖 '+t.a+'</div></div></div>';
}
function renderMetricas(){
  var desde=desdePeriodo();
  var cont=document.getElementById('metContent');
  var tot=sumar(MET,desde);
  var html='<div class="stats-grid">'
    +'<div class="stat-card"><div class="stat-num">'+tot.v+'</div><div class="stat-label">Vistas</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+tot.a+'</div><div class="stat-label">Aperturas del panel</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+tot.c+'</div><div class="stat-label">Clics</div></div>'
    +'<div class="stat-card"><div class="stat-num">'+ctr(tot)+'</div><div class="stat-label">CTR (clics / vistas)</div></div></div>';
  html+='<div class="bar"><span></span><button class="btn-sec" data-act="csv">⬇ Descargar CSV</button></div>';

  // Por banner y pueblo
  var porCol=COL.map(function(c){var b=BAN_BY[c.banner_id],a=b?ANUN_BY[b.anunciante_id]:null;return {c:c,b:b,a:a,t:sumar(MET_BY[c.id],desde)}}).filter(function(x){return x.b&&(x.t.v||x.t.a||x.t.c)});
  porCol.sort(function(x,y){return (y.t.c-x.t.c)||(y.t.v-x.t.v)});
  html+='<div class="sec-title">Por banner y pueblo</div>';
  html+=porCol.length?porCol.map(function(x){return filaRank(x.b.nombre+' · '+nombrePueblo(x.c),(x.a?x.a.nombre:'')+' · '+fmtF(x.c.fecha_inicio)+' → '+(x.c.fecha_fin?fmtF(x.c.fecha_fin):'sin fin'),x.t)}).join(''):'<div class="empty-slot">Sin datos en este periodo</div>';

  // Por anunciante
  var porAnun={};
  porCol.forEach(function(x){ if(!x.a) return; var k=x.a.id; var p=porAnun[k]=porAnun[k]||{a:x.a,t:{v:0,a:0,c:0}}; p.t.v+=x.t.v;p.t.a+=x.t.a;p.t.c+=x.t.c; });
  var la=Object.keys(porAnun).map(function(k){return porAnun[k]}).sort(function(x,y){return y.t.c-x.t.c});
  html+='<div class="sec-title">Por anunciante</div>';
  html+=la.length?la.map(function(x){return filaRank(x.a.nombre,x.a.codigo,x.t)}).join(''):'<div class="empty-slot">Sin datos en este periodo</div>';

  // Por pueblo donde se ve
  var porMun={};
  MET.forEach(function(m){ if(desde&&m.fecha<desde) return; var k=m.municipio||'(sin pueblo)'; var p=porMun[k]=porMun[k]||{v:0,a:0,c:0}; p.v+=m.vistas||0;p.a+=m.aperturas||0;p.c+=m.clics||0; });
  var lm=Object.keys(porMun).sort(function(x,y){return porMun[y].c-porMun[x].c||porMun[y].v-porMun[x].v});
  html+='<div class="sec-title">Por pueblo donde se ha visto</div>';
  html+=lm.length?lm.map(function(k){return filaRank(k,'',porMun[k])}).join(''):'<div class="empty-slot">Sin datos en este periodo</div>';

  // Por día
  if(periodoDias&&periodoDias<=30){
    var porDia={};
    MET.forEach(function(m){ if(m.fecha<desde) return; var p=porDia[m.fecha]=porDia[m.fecha]||{v:0,a:0,c:0}; p.v+=m.vistas||0;p.a+=m.aperturas||0;p.c+=m.clics||0; });
    var dias=Object.keys(porDia).sort().reverse();
    html+='<div class="sec-title">Por día</div>';
    html+=dias.length?dias.map(function(d){return filaRank(fmtF(d),'',porDia[d])}).join(''):'<div class="empty-slot">Sin datos en este periodo</div>';
  }
  cont.innerHTML=html;
}

function descargarCSV(){
  var desde=desdePeriodo();
  var filas=[['anunciante_codigo','anunciante','banner','pueblo','estado','fecha_inicio','fecha_fin','vistas','aperturas','clics','ctr_%']];
  COL.forEach(function(c){
    var b=BAN_BY[c.banner_id]; if(!b) return; var a=ANUN_BY[b.anunciante_id]; var t=sumar(MET_BY[c.id],desde);
    filas.push([a?a.codigo:'',a?a.nombre:'',b.nombre,nombrePueblo(c),estadoVisible(c),c.fecha_inicio||'',c.fecha_fin||'',t.v,t.a,t.c,t.v>0?(t.c*100/t.v).toFixed(2):'']);
  });
  var csv=filas.map(function(f){return f.map(function(x){var s=String(x==null?'':x);return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')}).join('\n');
  var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='kirolorik-publicidad-'+hoyISO()+(periodoDias?'-'+periodoDias+'d':'-todo')+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
}

  };
  var btn=document.getElementById('an_guardar'); btn.disabled=true;
  try{
    var res=await fetch(SB_URL+'/rest/v1/anunciantes'+(id?'?id=eq.'+encodeURIComponent(id):''),{method:id?'PATCH':'POST',headers:Object.assign(H(),{'Prefer':'return=minimal'}),body:JSON.stringify(datos)});

    +'<button type="button" class="btn-sec" id="bn_quitar" style="margin-top:6px;'+(bnImagen?'':'display:none')+'" data-act="quitar-img">✕ Quitar imagen</button></div>'
    +'<div class="prev" id="bn_prev"></div>'
    +'<label class="chk" style="margin-bottom:14px"><input type="checkbox" id="bn_activo"'+(n.activo!==false?' checked':'')+'> Banner visible (si se desmarca, no sale en ningún pueblo)</label>'
    +'<button class="btn-main" style="width:100%" id="bn_guardar" data-act="guardar-banner" data-id="'+esc(b?b.id:'')+'">'+(b?'Guardar banner':'Guardar y elegir pueblos')+'</button>');
  previewBanner();
}
function previewBanner(){
  var el=document.getElementById('bn_prev'); if(!el) return;
  var d=val('bn_desc'), imgFile=document.getElementById('bn_img'), src=bnQuitada?'':(window._bnVistaPrevia||bnImagen||'');
  el.innerHTML='<div class="prev-bar"><span class="t">Publicidad</span><span>📣</span><span style="min-width:0"><div class="n">'+esc(val('bn_nombre')||'Nombre del banner')+'</div><div class="s">'+esc(d.length>60?d.slice(0,60)+'...':d)+'</div></span></div>'
    +(/^https?:\/\//i.test(src)||/^blob:/.test(src)?'<img src="'+esc(src)+'" alt="">':'')
    +(val('bn_texto')||d?'<div class="l">'+esc(val('bn_texto')||d)+'</div>':'');
}
function elegirImagenBanner(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  window._bnVistaPrevia=URL.createObjectURL(f); bnQuitada=false;
  document.getElementById('bn_quitar').style.display=''; previewBanner();
}
function quitarImagenBanner(){
  var inp=document.getElementById('bn_img');
  if(inp&&inp.files&&inp.files.length){ inp.value=''; window._bnVistaPrevia=''; if(!bnImagen) document.getElementById('bn_quitar').style.display='none'; }
  else{ bnQuitada=true; window._bnVistaPrevia=''; document.getElementById('bn_quitar').style.display='none'; }
  previewBanner();
}
async function subirImagenBanner(file){
  var TIPOS_IMG={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'};
  var ext=TIPOS_IMG[file.type];
  if(!ext) throw new Error('Formato no permitido (usa JPG, PNG, WEBP o GIF)');
  if(file.size>5*1024*1024) throw new Error('Imagen demasiado grande (máx. 5 MB)');
  var nombre='banner_'+Date.now()+'.'+ext;
  var res=await fetch(SB_URL+'/storage/v1/object/banners/'+nombre,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+(authToken||SB_KEY),'Content-Type':file.type},body:file});
  if(!res.ok) throw new Error('Error al subir la imagen');
  return SB_URL+'/storage/v1/object/public/banners/'+nombre;
}
async function guardarBanner(id){
  var anun=val('bn_anun'), nombre=val('bn_nombre'), url=val('bn_url');
  if(!anun){toast('Elige el anunciante',true);return;}
  if(!nombre){toast('El nombre es obligatorio',true);return;}
  if(url&&!/^(https?:\/\/|mailto:|tel:)/i.test(url)){toast('El enlace debe empezar por https://, mailto: o tel:',true);return;}
  var btn=document.getElementById('bn_guardar'); btn.disabled=true;
  try{
    var datos={anunciante_id:anun,nombre:nombre,descripcion:val('bn_desc')||null,texto:val('bn_texto')||null,url_destino:url||null,activo:document.getElementById('bn_activo').checked};
    var f=document.getElementById('bn_img'); f=f&&f.files&&f.files[0];
    if(f) datos.imagen_url=await subirImagenBanner(f);
    else if(bnQuitada) datos.imagen_url=null;
    var res=await fetch(SB_URL+'/rest/v1/banners'+(id?'?id=eq.'+encodeURIComponent(id):''),{method:id?'PATCH':'POST',headers:Object.assign(H(),{'Prefer':'return=representation'}),body:JSON.stringify(datos)});
    var d=await res.json();
    if(!res.ok) throw new Error((d&&d.message)||'Error al guardar');
    var nuevoId=id||(d&&d[0]?d[0].id:null);
    toast('Banner guardado'); await cargarTodo();
    if(!id&&nuevoId) modalColocacion(null,nuevoId); else cerrarModal();
  }catch(e){ btn.disabled=false; toast('Error: '+e.message,true); }
}

// ── Colocaciones (banner + pueblos + fechas) ──
function conflictos(bannerId,municipioIds,ini,fin,excluirId){
  var b=BAN_BY[bannerId], a=b?ANUN_BY[b.anunciante_id]:null, tn=a&&a.tipo_negocio?TIPO_BY[a.tipo_negocio]:null;
  if(!tn||!tn.exclusivo||!ini) return [];
  var out=[], nfin=fin||'9999-12-31';
  municipioIds.forEach(function(mid){
    if(!mid) return;
    COL.forEach(function(c){
      if(c.id===excluirId||c.municipio_id!==mid||!c.exclusivo||c.tipo_negocio!==a.tipo_negocio) return;
      if(['pendiente_pago','confirmada','pausada'].indexOf(c.estado)<0) return;
      var cfin=c.fecha_fin||'9999-12-31';
      if(c.fecha_inicio<=nfin&&ini<=cfin) out.push({mid:mid,col:c});
    });
  });
  return out;
}
function modalColocacion(col,bannerId){
  var edit=!!col, bid=edit?col.banner_id:bannerId, b=BAN_BY[bid], a=b?ANUN_BY[b.anunciante_id]:null, c=col||{};
  var tn=a&&a.tipo_negocio&&TIPO_BY[a.tipo_negocio]?TIPO_BY[a.tipo_negocio]:null;
  var hoy=hoyISO();
  var cuerpoPueblos=edit
    ?'<div class="field"><label>Pueblo</label><input type="text" value="'+esc(nombrePueblo(col))+'" disabled><div class="sheet-note" style="margin:4px 0 0">Para cambiar de pueblo, cancela esta colocación y crea otra.</div></div>'
    :'<div class="field"><label>Pueblos</label><div class="towns">'
      +'<label style="grid-column:1/-1"><input type="checkbox" id="co_todos" onchange="alternarTodos()"> <b>Todos los pueblos</b> (se muestra siempre, sin exclusividad)</label>'
      +MUN.map(function(m){return '<label><input type="checkbox" class="co_mun" value="'+esc(m.id)+'" onchange="avisoConflictos()"> '+esc(m.nombre)+'</label>'}).join('')+'</div></div>';
  var tarifasOpts='<option value="">— Sin tarifa —</option>'+TARIFAS.map(function(t){return '<option value="'+esc(t.id)+'"'+(c.tarifa_id===t.id?' selected':'')+'>'+esc(t.plan+' · '+t.precio+' €')+'</option>'}).join('');
  var estadosSel=['borrador','revision','rechazada','pendiente_pago','confirmada','pausada','cancelada'];
  var estadoIni=c.estado||'confirmada';
  abrirModal(edit?'Editar colocación':'Colocar banner en pueblos',
    '<div class="sheet-note"><b>'+esc(b?b.nombre:'')+'</b> · '+esc(a?a.nombre:'')+(tn?' · '+esc(tn.nombre)+(tn.exclusivo?' (exclusivo por pueblo)':' (sin exclusividad)'):'')+'</div>'
    +cuerpoPueblos
    +'<div class="row2"><div class="field"><label>Fecha inicio *</label><input type="date" id="co_ini" value="'+esc(c.fecha_inicio||hoy)+'" onchange="avisoConflictos()"></div>'
    +'<div class="field"><label>Fecha fin</label><input type="date" id="co_fin" value="'+esc(c.fecha_fin||'')+'" onchange="avisoConflictos()"></div></div>'
    +'<div class="sheet-note">Sin fecha de fin = continúa hasta que se pause o se cancele (renovación automática).</div>'
    +'<div class="row2"><div class="field"><label>Origen</label><select id="co_origen"><option value="cortesia"'+(c.origen==='cortesia'?' selected':'')+'>Cortesía</option><option value="acuerdo"'+(c.origen==='acuerdo'?' selected':'')+'>Acuerdo</option><option value="pago"'+(c.origen==='pago'||!edit?' selected':'')+'>Pago</option></select></div>'
    +'<div class="field"><label>Renovación</label><select id="co_ren"><option value="prepago"'+(c.modo_renovacion!=='automatica'?' selected':'')+'>Prepago por periodo</option><option value="automatica"'+(c.modo_renovacion==='automatica'?' selected':'')+'>Automática</option></select></div></div>'
    +'<div class="row2"><div class="field"><label>Estado</label><select id="co_estado">'+estadosSel.map(function(e){return '<option value="'+e+'"'+(e===estadoIni?' selected':'')+'>'+esc(ESTADOS_BD[e])+'</option>'}).join('')+'</select></div>'
    +'<div class="field"><label>Tarifa</label><select id="co_tarifa">'+tarifasOpts+'</select></div></div>'
    +'<div class="field"><label>Orden <span style="font-weight:400;text-transform:none;letter-spacing:0">(los de «todos los pueblos» y del pueblo se mezclan al azar)</span></label><input type="number" id="co_orden" value="'+esc(c.orden||0)+'"></div>'
    +'<div class="field"><label>Motivo de rechazo</label><input type="text" id="co_motivo" value="'+esc(c.motivo_rechazo||'')+'"></div>'
    +'<div class="field"><label>Notas internas</label><textarea id="co_notas">'+esc(c.notas||'')+'</textarea></div>'
    +'<div id="co_aviso"></div>'
    +'<button class="btn-main" style="width:100%" id="co_guardar" data-act="guardar-col" data-id="'+esc(edit?col.id:'')+'" data-banner="'+esc(bid)+'">'+(edit?'Guardar colocación':'Crear colocaciones')+'</button>');
  avisoConflictos();
}
function alternarTodos(){
  var t=document.getElementById('co_todos').checked;
  document.querySelectorAll('.co_mun').forEach(function(x){ x.disabled=t; if(t) x.checked=false; });
  avisoConflictos();
}
function leerPueblos(){
  var todos=document.getElementById('co_todos');
  if(todos&&todos.checked) return [null];
  return Array.prototype.slice.call(document.querySelectorAll('.co_mun:checked')).map(function(x){return x.value});
}
function avisoConflictos(){
  var btn=document.getElementById('co_guardar'); if(!btn) return;
  var id=btn.getAttribute('data-id'), bid=btn.getAttribute('data-banner');
  var mids=id?[COL_BY[id]?COL_BY[id].municipio_id:null]:leerPueblos();
  var estado=val('co_estado');
  var aplica=['pendiente_pago','confirmada','pausada'].indexOf(estado)>=0;
  var cs=aplica?conflictos(bid,mids,val('co_ini'),val('co_fin'),id||null):[];
  var cont=document.getElementById('co_aviso'); if(!cont) return;
  cont.innerHTML=cs.length?'<div class="warn">⚠️ Hueco ocupado (mismo tipo de negocio, mismo pueblo y fechas que se solapan):<ul>'+cs.map(function(x){
    var b=BAN_BY[x.col.banner_id], a=b?ANUN_BY[b.anunciante_id]:null;
    return '<li><b>'+esc(MUN_BY[x.mid]?MUN_BY[x.mid].nombre:'')+'</b>: '+esc(a?a.nombre:'')+' ('+fmtF(x.col.fecha_inicio)+' → '+(x.col.fecha_fin?fmtF(x.col.fecha_fin):'sin fin')+')</li>';
  }).join('')+'</ul></div>':'';
}
async function guardarColocacion(id,bid){
  var ini=val('co_ini'), fin=val('co_fin');
  if(!ini){toast('Indica la fecha de inicio',true);return;}
  if(fin&&fin<ini){toast('La fecha de fin no puede ser anterior a la de inicio',true);return;}
  var comun={
    estado:val('co_estado'), fecha_inicio:ini, fecha_fin:fin||null, origen:val('co_origen'), modo_renovacion:val('co_ren'),
    tarifa_id:val('co_tarifa')||null, orden:parseInt(val('co_orden'),10)||0, motivo_rechazo:val('co_motivo')||null, notas:val('co_notas')||null
  };
  var btn=document.getElementById('co_guardar');
  var mids=id?null:leerPueblos();
  if(!id&&!mids.length){toast('Elige al menos un pueblo (o «Todos los pueblos»)',true);return;}
  var cs=(['pendiente_pago','confirmada','pausada'].indexOf(comun.estado)>=0)?conflictos(bid,id?[COL_BY[id].municipio_id]:mids,ini,fin,id||null):[];
  if(cs.length){toast('Hay huecos ocupados: revisa el aviso',true);return;}
  btn.disabled=true;
  try{
    var res;
    if(id){
      res=await fetch(SB_URL+'/rest/v1/colocaciones?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:Object.assign(H(),{'Prefer':'return=minimal'}),body:JSON.stringify(comun)});
    }else{
      var filas=mids.map(function(m){return Object.assign({banner_id:bid,municipio_id:m},comun)});
      res=await fetch(SB_URL+'/rest/v1/colocaciones',{method:'POST',headers:Object.assign(H(),{'Prefer':'return=minimal'}),body:JSON.stringify(filas)});
    }
    if(!res.ok){ var t=await res.text(); throw new Error(t.indexOf('colocaciones_exclusividad')>=0?'Ese hueco ya está ocupado por otro anunciante del mismo tipo (no se ha guardado nada)':t); }
    cerrarModal(); toast(id?'Colocación guardada':(mids.length>1?mids.length+' colocaciones creadas':'Colocación creada')); await cargarTodo();
  }catch(e){ btn.disabled=false; toast('Error: '+e.message,true); }
}
async function cambiarEstadoCol(id,estado,pregunta){
  if(pregunta&&!confirm(pregunta)) return;
  try{
    var res=await fetch(SB_URL+'/rest/v1/colocaciones?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:Object.assign(H(),{'Prefer':'return=minimal'}),body:JSON.stringify({estado:estado})});
    if(!res.ok){ var t=await res.text(); throw new Error(t.indexOf('colocaciones_exclusividad')>=0?'Ese hueco ya está ocupado por otro anunciante del mismo tipo':t); }
    toast('Estado actualizado'); await cargarTodo();
  }catch(e){ toast('Error: '+e.message,true); }
}

// ── Métricas de una colocación ──
function modalMetricasCol(id){
  var c=COL_BY[id], b=c?BAN_BY[c.banner_id]:null; if(!c||!b) return;
  var filas=(MET_BY[id]||[]).slice().sort(function(x,y){return String(y.fecha).localeCompare(String(x.fecha))});
  var t=sumar(filas);
  var porMun={}; filas.forEach(function(m){var k=m.municipio||'(sin pueblo)';var p=porMun[k]=porMun[k]||{v:0,a:0,c:0};p.v+=m.vistas;p.a+=m.aperturas;p.c+=m.clics});
  abrirModal('Métricas · '+b.nombre,
    '<div class="sheet-note">'+esc(nombrePueblo(c))+' · '+fmtF(c.fecha_inicio)+' → '+(c.fecha_fin?fmtF(c.fecha_fin):'sin fin')+'</div>'
    +'<div class="stats-grid"><div class="stat-card"><div class="stat-num">'+t.v+'</div><div class="stat-label">Vistas</div></div><div class="stat-card"><div class="stat-num">'+t.a+'</div><div class="stat-label">Aperturas</div></div><div class="stat-card"><div class="stat-num">'+t.c+'</div><div class="stat-label">Clics</div></div><div class="stat-card"><div class="stat-num">'+ctr(t)+'</div><div class="stat-label">CTR</div></div></div>'
    +(Object.keys(porMun).length>1||!c.municipio_id?'<div class="sec-title" style="margin-top:6px">Por pueblo donde se ha visto</div>'+Object.keys(porMun).map(function(k){return filaRank(k,'',porMun[k])}).join(''):'')
    +'<div class="sec-title">Por día</div>'+(filas.length?filas.map(function(m){return filaRank(fmtF(m.fecha)+(m.municipio?' · '+m.municipio:''),'',{v:m.vistas,a:m.aperturas,c:m.clics})}).join(''):'<div class="empty-slot">Aún sin datos</div>'));
}

// ── ACCIONES (un único listener; los datos viajan en data-*) ──
document.addEventListener('click',function(ev){
  var per=ev.target.closest?ev.target.closest('#periodoBtns button'):null;
  if(per){ periodoDias=parseInt(per.getAttribute('data-per'),10)||0; document.querySelectorAll('#periodoBtns button').forEach(function(x){x.classList.toggle('on',x===per)}); renderMetricas(); return; }
  var b=ev.target.closest?ev.target.closest('[data-act]'):null; if(!b) return;
  var act=b.getAttribute('data-act'), id=b.getAttribute('data-id');
  if(act==='cerrar') cerrarModal();
  else if(act==='nuevo-banner') modalBanner(null,'');
  else if(act==='nuevo-banner-de') modalBanner(null,id);
  else if(act==='nuevo-anun') modalAnunciante(null);
  else if(act==='edit-anun') modalAnunciante(ANUN_BY[id]);
  else if(act==='guardar-anun') guardarAnunciante(id);
  else if(act==='edit-banner') modalBanner(BAN_BY[id],'');
  else if(act==='guardar-banner') guardarBanner(id);
  else if(act==='quitar-img') quitarImagenBanner();
  else if(act==='add-col') modalColocacion(null,id);
  else if(act==='edit-col') modalColocacion(COL_BY[id],null);
  else if(act==='guardar-col') guardarColocacion(id,b.getAttribute('data-banner'));
  else if(act==='pausar') cambiarEstadoCol(id,'pausada');
  else if(act==='reanudar'||act==='confirmar') cambiarEstadoCol(id,'confirmada');
  else if(act==='cancelar') cambiarEstadoCol(id,'cancelada','¿Cancelar esta colocación? Dejará de mostrarse y liberará el hueco (las métricas se conservan).');
  else if(act==='metricas-col') modalMetricasCol(id);
  else if(act==='csv') descargarCSV();
});

// ── INIT ──
var savedToken=KBS.get('kb_admin_token');
var savedUser=KBS.get('kb_admin_user');
if(savedToken&&savedUser){
  authToken=savedToken;
  try{ authUser=JSON.parse(savedUser); }catch(e){ authUser=null; }
  if(authUser&&authUser.email===ADMIN_EMAIL){
    if(jwtExp(savedToken)-Date.now()<60000){
      refrescarSesion().then(function(ok){ if(ok) mostrarAdmin(); else sesionCaducada(); });
    }else mostrarAdmin();
  }else{
    mostrarDenegado();
  }
}else{
  document.getElementById('loginScreen').style.display='flex';
}
</script>
