<!-- Kirolorik · admin/usuarios.html · v1.00 · 2026-06-17 -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a6bff">
<meta name="robots" content="noindex, nofollow">
<title>Kirolorik · Administrar usuarios</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px;flex-shrink:0}
.tab{padding:10px 18px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.user-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:8px}
.user-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.user-email{font-size:13px;font-weight:700;color:var(--text);word-break:break-all}
.user-meta{font-size:10px;color:var(--muted);margin-top:2px}
.user-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.badge-active{background:rgba(22,163,74,0.1);color:#16a34a}
.badge-banned{background:rgba(220,38,38,0.1);color:#dc2626}
.user-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ua-btn{
  font-size:11px;font-weight:600;padding:7px 12px;border-radius:8px;
  border:1px solid var(--border);background:var(--bg);color:var(--text2);
  cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;
}
.ua-btn:hover{border-color:var(--accent);color:var(--accent)}
.ua-btn.danger:hover{border-color:#dc2626;color:#dc2626}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--surface);border-radius:var(--radius);padding:20px;width:100%;max-width:360px}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;margin-bottom:14px;color:var(--text)}

.eq-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:4px 10px;margin:2px 4px 2px 0}
</style>
</head>
<body>

<div id="loginScreen" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:32px 16px">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:4px;color:var(--accent)">KIROLORIK</div>
  <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:-12px">Administración</div>
  <div style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;margin-top:8px">
    <div class="field" style="margin:0"><label>Email</label><input type="email" id="loginEmail" placeholder="admin@kirolorik.app"></div>
    <div class="field" style="margin:0"><label>Contraseña</label><input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"></div>
    <div id="loginError" style="font-size:12px;color:#dc2626;min-height:16px"></div>
    <button style="background:var(--accent);color:var(--accent-txt);border:none;border-radius:var(--radius-sm);padding:14px;font-size:14px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif" id="loginBtn" onclick="login()">Entrar</button>
  </div>
</div>

<div id="deniedScreen" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;padding:32px 16px;text-align:center">
  <div style="font-size:36px">🔒</div>
  <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--text)">Acceso restringido</div>
  <div style="font-size:13px;color:var(--muted)">Esta sección es solo para administradores.</div>
  <button onclick="window.location.href='/'" style="background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:12px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif">Volver al inicio</button>
</div>

<div id="adminScreen" style="display:none">
<div class="admin-wrap">

  <div class="admin-header">
    <div>
      <div class="admin-logo">Kirolorik</div>
      <div class="admin-sub">Administrar usuarios</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button onclick="window.location.href='/'" style="font-size:11px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer;font-family:'DM Sans',sans-serif">← Inicio</button>
      <button onclick="window.location.href='/admin/eventos.html'" style="font-size:11px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer;font-family:'DM Sans',sans-serif">📋 Eventos</button>
    </div>
  </div>

  <div class="field" style="margin-bottom:16px">
    <input type="text" id="searchUser" placeholder="Buscar por email..." oninput="renderUsers()" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);width:100%;outline:none">
  </div>

  <div id="usersList"><div class="empty-slot">Cargando...</div></div>

</div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://glscnwctcvrosmbrljns.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdsc2Nud2N0Y3Zyb3NtYnJsam5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTcyNjksImV4cCI6MjA5MjYzMzI2OX0.coUfdaThWGrwV8w-MixbWYfgidoi_q_60Y-3KinfeFw';
const ADMIN_EMAIL = 'kirolorik.app@gmail.com';

let authToken = null;
let authUser = null;
let allUsers = [];
let allTeams = [];

function H(){ return {'apikey':SB_KEY,'Authorization':'Bearer '+(authToken||SB_KEY),'Content-Type':'application/json'}; }

function toast(msg,err){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show'+(err?' error':'');
  setTimeout(function(){t.className='toast'},3000);
}

function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

// ── AUTH ──
async function login(){
  var email=document.getElementById('loginEmail').value.trim();
  var pass=document.getElementById('loginPass').value;
  var err=document.getElementById('loginError');
  var btn=document.getElementById('loginBtn');
  err.textContent='';btn.disabled=true;btn.textContent='...';
  try{
    var res=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:email,password:pass})
    });
    var data=await res.json();
    if(!res.ok) throw new Error(data.error_description||'Error');
    if(data.user.email!==ADMIN_EMAIL){
      throw new Error('Esta cuenta no tiene permisos de administrador');
    }
    authToken=data.access_token;
    authUser=data.user;
    sessionStorage.setItem('kb_admin_token',authToken);
    sessionStorage.setItem('kb_admin_user',JSON.stringify(authUser));
    mostrarAdmin();
  }catch(e){
    err.textContent=e.message;
    btn.disabled=false;btn.textContent='Entrar';
  }
}

function mostrarAdmin(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('deniedScreen').style.display='none';
  document.getElementById('adminScreen').style.display='block';
  loadUsers();
}

function mostrarDenegado(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('adminScreen').style.display='none';
  document.getElementById('deniedScreen').style.display='flex';
}

// ── LLAMADA A EDGE FUNCTION ──
async function callAdminFn(body){
  var res=await fetch(SB_URL+'/functions/v1/admin-users',{
    method:'POST',
    headers:{'Authorization':'Bearer '+authToken,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  var data=await res.json();
  if(!res.ok) throw new Error(data.error||'Error');
  return data;
}

// ── CARGAR USUARIOS Y EQUIPOS ──
async function loadUsers(){
  try{
    var data=await callAdminFn({action:'list_users'});
    allUsers=data.users||[];
  }catch(e){
    toast('Error cargando usuarios: '+e.message,true);
    allUsers=[];
  }
  try{
    var res=await fetch(SB_URL+'/rest/v1/mis_equipos?select=id,nombre,deporte,user_id&activo=eq.true',{headers:H()});
    allTeams=await res.json()||[];
  }catch(e){ allTeams=[]; }
  renderUsers();
}

function teamsOf(userId){
  return allTeams.filter(function(t){return t.user_id===userId});
}

function renderUsers(){
  var list=document.getElementById('usersList');
  var q=(document.getElementById('searchUser').value||'').toLowerCase();
  var filtered=allUsers.filter(function(u){return !q||(u.email||'').toLowerCase().includes(q)});

  if(!filtered.length){
    list.innerHTML='<div class="empty-slot">Sin usuarios'+(q?' que coincidan':'')+'</div>';
    return;
  }

  list.innerHTML=filtered.map(function(u){
    var banned=u.banned_until&&new Date(u.banned_until)>new Date();
    var teams=teamsOf(u.id);
    var teamsHtml=teams.length?teams.map(function(t){return '<span class="eq-tag">'+(t.deporte?SP_EMOJI(t.deporte):'👕')+' '+esc(t.nombre)+'</span>'}).join(''):'<span style="font-size:11px;color:var(--muted)">Sin equipos</span>';
    return '<div class="user-card">'
      +'<div class="user-top">'
      +'<div><div class="user-email">'+esc(u.email)+'</div><div class="user-meta">Registrado: '+fd(u.created_at)+(u.last_sign_in_at?' · Último acceso: '+fd(u.last_sign_in_at):' · Nunca ha entrado')+'</div></div>'
      +'<div class="user-badge '+(banned?'badge-banned':'badge-active')+'">'+(banned?'Bloqueado':'Activo')+'</div>'
      +'</div>'
      +'<div style="margin:8px 0">'+teamsHtml+'</div>'
      +'<div class="user-actions">'
      +'<button class="ua-btn" onclick="openResetPass(&quot;'+u.id+'&quot;,&quot;'+esc(u.email)+'&quot;)">🔑 Resetear contraseña</button>'
      +'<button class="ua-btn" onclick="openChangeEmail(&quot;'+u.id+'&quot;,&quot;'+esc(u.email)+'&quot;)">✉️ Cambiar email</button>'
      +(banned
        ?'<button class="ua-btn" onclick="unbanUser(&quot;'+u.id+'&quot;)">✅ Reactivar</button>'
        :'<button class="ua-btn danger" onclick="banUser(&quot;'+u.id+'&quot;,&quot;'+esc(u.email)+'&quot;)">🚫 Bloquear</button>')
      +'</div>'
      +'</div>';
  }).join('');
}

function SP_EMOJI(d){
  var m={futbol:'⚽',basket:'🏀',balonmano:'🤾',waterpolo:'🏊',boxeo:'🥊',tenis:'🎾',atletismo:'🏃',ciclismo:'🚴',voley:'🏐',natacion:'🏊',padel:'🎾',ajedrez:'♟️',rugby:'🏉',hockey:'🏒'};
  return m[d]||'🏅';
}

function fd(iso){
  if(!iso) return '—';
  var d=new Date(iso);
  return d.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
}

// ── ACCIONES ──
function openResetPass(userId,email){
  var modal=document.createElement('div');
  modal.className='modal-bg';
  modal.innerHTML='<div class="modal-box">'
    +'<div class="modal-title">Resetear contraseña</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:14px">'+email+'</div>'
    +'<div class="field"><label>Nueva contraseña</label><input type="password" id="newPassInput" placeholder="Mínimo 8 caracteres"></div>'
    +'<div id="modalErr" style="font-size:12px;color:#dc2626;min-height:16px"></div>'
    +'<div style="display:flex;gap:8px;margin-top:8px">'
    +'<button class="ua-btn" onclick="this.closest(&quot;.modal-bg&quot;).remove()" style="flex:1">Cancelar</button>'
    +'<button class="ua-btn" onclick="doResetPass(&quot;'+userId+'&quot;)" style="flex:1;background:var(--accent);color:#fff;border-color:var(--accent)">Confirmar</button>'
    +'</div></div>';
  modal.addEventListener('click',function(e){if(e.target===modal)modal.remove()});
  document.body.appendChild(modal);
}

async function doResetPass(userId){
  var pass=document.getElementById('newPassInput').value;
  var err=document.getElementById('modalErr');
  if(pass.length<8){err.textContent='Mínimo 8 caracteres';return}
  try{
    await callAdminFn({action:'reset_password',target_user_id:userId,new_password:pass});
    toast('✅ Contraseña actualizada');
    document.querySelector('.modal-bg').remove();
  }catch(e){
    err.textContent=e.message;
  }
}

function openChangeEmail(userId,currentEmail){
  var modal=document.createElement('div');
  modal.className='modal-bg';
  modal.innerHTML='<div class="modal-box">'
    +'<div class="modal-title">Cambiar email</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:14px">Actual: '+currentEmail+'</div>'
    +'<div class="field"><label>Nuevo email</label><input type="email" id="newEmailInput" placeholder="nuevo@email.com"></div>'
    +'<div id="modalErr" style="font-size:12px;color:#dc2626;min-height:16px"></div>'
    +'<div style="display:flex;gap:8px;margin-top:8px">'
    +'<button class="ua-btn" onclick="this.closest(&quot;.modal-bg&quot;).remove()" style="flex:1">Cancelar</button>'
    +'<button class="ua-btn" onclick="doChangeEmail(&quot;'+userId+'&quot;)" style="flex:1;background:var(--accent);color:#fff;border-color:var(--accent)">Confirmar</button>'
    +'</div></div>';
  modal.addEventListener('click',function(e){if(e.target===modal)modal.remove()});
  document.body.appendChild(modal);
}

async function doChangeEmail(userId){
  var email=document.getElementById('newEmailInput').value.trim();
  var err=document.getElementById('modalErr');
  if(!email||!email.includes('@')){err.textContent='Email no válido';return}
  try{
    await callAdminFn({action:'change_email',target_user_id:userId,new_email:email});
    toast('✅ Email actualizado');
    document.querySelector('.modal-bg').remove();
    loadUsers();
  }catch(e){
    err.textContent=e.message;
  }
}

async function banUser(userId,email){
  if(!confirm('¿Bloquear a '+email+'? No podrá iniciar sesión hasta que lo reactives.')) return;
  try{
    await callAdminFn({action:'ban_user',target_user_id:userId});
    toast('Usuario bloqueado');
    loadUsers();
  }catch(e){
    toast('Error: '+e.message,true);
  }
}

async function unbanUser(userId){
  try{
    await callAdminFn({action:'unban_user',target_user_id:userId});
    toast('✅ Usuario reactivado');
    loadUsers();
  }catch(e){
    toast('Error: '+e.message,true);
  }
}

// ── INIT ──
var savedToken=sessionStorage.getItem('kb_admin_token');
var savedUser=sessionStorage.getItem('kb_admin_user');
if(savedToken&&savedUser){
  authToken=savedToken;
  try{ authUser=JSON.parse(savedUser); }catch(e){ authUser=null; }
  if(authUser&&authUser.email===ADMIN_EMAIL){
    mostrarAdmin();
  }else{
    mostrarDenegado();
  }
}else{
  document.getElementById('loginScreen').style.display='flex';
}
</script>

</body>
</html>
