<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirolorik ? Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --surface: #181818; --border: #2a2a2a;
    --accent: #e8ff47; --text: #f0f0f0; --muted: #666;
  }
  body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); min-height: 100vh; padding: 20px 16px 60px; max-width: 480px; margin: 0 auto; }

  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .logo { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: 2px; }
  .header-sub { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  .section { margin-bottom: 28px; }
  .section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 12px; }

  .field { margin-bottom: 12px; }
  label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; font-size: 14px;
    font-family: 'DM Sans', sans-serif; color: var(--text); outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select option { background: #222; }
  textarea { resize: vertical; min-height: 60px; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn-submit {
    width: 100%; background: var(--accent); color: #000;
    border: none; border-radius: 14px; padding: 16px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    letter-spacing: 0.5px; margin-top: 8px;
    transition: opacity 0.2s;
  }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #000; border-radius: 12px;
    padding: 12px 24px; font-size: 13px; font-weight: 700;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: #f44336; color: #fff; }

  .eventos-list { margin-top: 24px; }
  .evento-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .evento-bar { width: 3px; align-self: stretch; border-radius: 4px; flex-shrink: 0; }
  .evento-info { flex: 1; min-width: 0; }
  .evento-teams { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .evento-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .evento-delete { font-size: 18px; cursor: pointer; flex-shrink: 0; opacity: 0.4; transition: opacity 0.2s; }
  .evento-delete:hover { opacity: 1; }

  .sport-colors { --c-futbol:#4CAF50; --c-basket:#FF9800; --c-balonmano:#4a9eff; --c-waterpolo:#00BCD4; --c-boxeo:#f44336; --c-tenis:#CDDC39; --c-atletismo:#E91E63; --c-otros:#9C27B0; }
</style>
</head>
<body class="sport-colors">

<div class="header">
  <div>
    <div class="logo">KIROLORIK</div>
    <div class="header-sub">Panel de administraci?n</div>
  </div>
</div>

<!-- FORMULARIO NUEVO EVENTO -->
<div class="section">
  <div class="section-title">? Nuevo evento</div>

  <div class="row2">
    <div class="field">
      <label>Deporte</label>
      <select id="deporte">
        <option value="futbol">? F?tbol</option>
        <option value="basket">? Basket</option>
        <option value="balonmano">? Balonmano</option>
        <option value="waterpolo">? Waterpolo</option>
        <option value="boxeo">? Boxeo</option>
        <option value="tenis">? Tenis</option>
        <option value="atletismo">? Atletismo</option>
        <option value="ciclismo">? Ciclismo</option>
        <option value="otros">? Otros</option>
      </select>
    </div>
    <div class="field">
      <label>G?nero</label>
      <select id="genero">
        <option value="Sin especificar">Sin especificar</option>
        <option value="Masculino">Masculino</option>
        <option value="Femenino">Femenino</option>
        <option value="Mixto">Mixto</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Nombre del evento <span style="color:var(--muted);font-weight:400">(ciclismo, atletismo...)</span></label>
    <input type="text" id="nombre_evento" placeholder="Ej: Gran Premio Eibar ? opcional si hay equipos">
  </div>

  <div class="row2">
    <div class="field">
      <label>Categor?a</label>
      <select id="categoria">
        <option value="Benjam?n">Benjam?n</option>
        <option value="Alev?n">Alev?n</option>
        <option value="Infantil">Infantil</option>
        <option value="Cadete">Cadete</option>
        <option value="Juvenil">Juvenil</option>
        <option value="Junior">Junior</option>
        <option value="Senior">Senior</option>
        <option value="Veteranos">Veteranos</option>
        <option value="Todas">Todas las categor?as</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Equipo local</label>
    <input type="text" id="equipo_local" placeholder="Nombre del equipo local">
  </div>

  <div class="field">
    <label>Equipo visitante</label>
    <input type="text" id="equipo_visitante" placeholder="Nombre del equipo visitante">
  </div>

  <div class="row2">
    <div class="field">
      <label>Fecha</label>
      <input type="date" id="fecha">
    </div>
    <div class="field">
      <label>Hora</label>
      <input type="time" id="hora">
    </div>
  </div>

  <div class="field">
    <label>Municipio</label>
    <input type="text" id="municipio" placeholder="Eibar, Ermua, Elgoibar...">
  </div>

  <div class="field">
    <label>Instalaci?n</label>
    <input type="text" id="instalacion" placeholder="Nombre del recinto o campo">
  </div>

  <div class="row2">
    <div class="field">
      <label>Entrada</label>
      <select id="tipo_entrada">
        <option value="gratis">? Gratis</option>
        <option value="pago">? De pago</option>
        <option value="rifa">? Rifa</option>
        <option value="sin info">? Sin info</option>
      </select>
    </div>
    <div class="field">
      <label>Competici?n</label>
      <select id="tipo_competicion">
        <option value="Liga">? Liga</option>
        <option value="Copa">? Copa</option>
        <option value="Torneo">? Torneo</option>
        <option value="Amistoso">? Amistoso</option>
        <option value="Play-off">? Play-off</option>
      </select>
    </div>
  </div>

  <button class="btn-submit" id="btnGuardar" onclick="guardarEvento()">Guardar evento</button>
</div>

<!-- LISTA EVENTOS -->
<div class="section">
  <div class="section-title">? Eventos guardados</div>
  <div class="eventos-list" id="eventosList">
    <div style="font-size:12px;color:var(--muted);text-align:center;padding:20px;">Cargando...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const URL = 'https://glscnwctcvrosmbrljns.supabase.co';
  const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdsc2Nud2N0Y3Zyb3NtYnJsam5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTcyNjksImV4cCI6MjA5MjYzMzI2OX0.coUfdaThWGrwV8w-MixbWYfgidoi_q_60Y-3KinfeFw';
  const HEADERS = { 'Content-Type': 'application/json', 'apikey': KEY, 'Authorization': `Bearer ${KEY}` };

  const SPORT_COLORS = {
    futbol:'#4CAF50', basket:'#FF9800', balonmano:'#4a9eff',
    waterpolo:'#00BCD4', boxeo:'#f44336', tenis:'#CDDC39',
    atletismo:'#E91E63', otros:'#9C27B0'
  };

  // Fecha de hoy por defecto
  document.getElementById('fecha').value = new Date().toISOString().split('T')[0];

  function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (error ? ' error' : '');
    setTimeout(() => t.className = 'toast', 3000);
  }

  async function guardarEvento() {
    const btn = document.getElementById('btnGuardar');
    const local = document.getElementById('equipo_local').value.trim();
    const visitante = document.getElementById('equipo_visitante').value.trim();
    const fecha = document.getElementById('fecha').value;
    const hora = document.getElementById('hora').value;
    const municipio = document.getElementById('municipio').value.trim();

    if (!local || !visitante || !fecha || !hora || !municipio) {
      showToast('Rellena todos los campos obligatorios', true);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Guardando...';

    const evento = {
      deporte: document.getElementById('deporte').value,
      genero: document.getElementById('genero').value,
      nombre_evento: document.getElementById('nombre_evento').value.trim(),
      categoria: document.getElementById('categoria').value,
      equipo_local: local,
      equipo_visitante: visitante,
      fecha, hora, municipio,
      instalacion: document.getElementById('instalacion').value.trim(),
      tipo_entrada: document.getElementById('tipo_entrada').value,
      tipo_competicion: document.getElementById('tipo_competicion').value,
      activo: true
    };

    try {
      const res = await fetch(`${URL}/rest/v1/eventos`, {
        method: 'POST',
        headers: { ...HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify(evento)
      });
      if (!res.ok) throw new Error();
      showToast('? Evento guardado');
      document.getElementById('equipo_local').value = '';
      document.getElementById('equipo_visitante').value = '';
      document.getElementById('instalacion').value = '';
      document.getElementById('hora').value = '';
      cargarEventos();
    } catch {
      showToast('Error al guardar. Revisa la conexi?n.', true);
    }

    btn.disabled = false;
    btn.textContent = 'Guardar evento';
  }

  async function cargarEventos() {
    const list = document.getElementById('eventosList');
    try {
      const res = await fetch(`${URL}/rest/v1/eventos?select=*&order=fecha.asc,hora.asc&activo=eq.true`, { headers: HEADERS });
      const data = await res.json();
      if (!data.length) {
        list.innerHTML = '<div style="font-size:12px;color:var(--muted);text-align:center;padding:20px;">Sin eventos todav?a</div>';
        return;
      }
      list.innerHTML = data.map(e => `
        <div class="evento-card">
          <div class="evento-bar" style="background:${SPORT_COLORS[e.deporte] || '#666'}"></div>
          <div class="evento-info">
            <div class="evento-teams">${e.equipo_local} ? ${e.equipo_visitante}</div>
            <div class="evento-meta">${e.deporte} ? ${e.categoria} ? ${e.fecha} ${e.hora?.slice(0,5)} ? ${e.municipio}</div>
          </div>
          <div class="evento-delete" onclick="borrarEvento(${e.id})">??</div>
        </div>`).join('');
    } catch {
      list.innerHTML = '<div style="font-size:12px;color:#f44336;text-align:center;padding:20px;">Error al cargar eventos</div>';
    }
  }

  async function borrarEvento(id) {
    if (!confirm('?Borrar este evento?')) return;
    try {
      await fetch(`${URL}/rest/v1/eventos?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
      showToast('Evento eliminado');
      cargarEventos();
    } catch {
      showToast('Error al borrar', true);
    }
  }

  cargarEventos();
</script>
</body>
</html>
