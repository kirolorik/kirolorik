<!--
Proyecto: Kirolorik
Archivo: index.html
Versión: v6.39
Fecha: 2026-10-24
Descripción: Parrilla principal. v6.27: el botón del banner abre webs externas en pestaña nueva
(los mailto: y tel: no) y registra cada clic en la tabla banner_clicks de Supabase.
v6.28: eliminado un </div> sobrante antes de la barra inferior.
v6.29: seguridad. Escapado con esc() de todo texto de Supabase insertado como HTML (tarjetas, detalle,
municipios, banners); solo se aceptan URLs http(s) en imágenes y enlaces; la parrilla excluye eventos test.
v6.30: el salto al siguiente día con eventos funciona (la consulta trae desde el día elegido en adelante y se
filtra el día en cliente); el detalle muestra la lista de participantes.
v6.31: etiqueta de versión en la esquina inferior derecha (página y caché del Service Worker).
v6.32: etiqueta más corta (índice v6.32 · #v9).
v6.33: el detalle muestra el escudo del visitante cuando es un equipo de mis_equipos (equipo_visitante_id).
v6.34: el escudo sale del club (clubes.escudo_url) y no del equipo, para local y visitante; si el equipo no tiene club, se usa el suyo.
v6.35: al cambiar de municipio el día vuelve a hoy (y salta al primer día con eventos, también hacia atrás respecto
al día que había elegido); se ignoran las respuestas de consultas antiguas de la parrilla.
v6.36: el inicio de sesión guarda también el refresh token para que el admin pueda renovar la sesión caducada.
v6.37: el filtro pasa de equipos a clubes (un club reúne los eventos de todos sus equipos y los que organiza); el detalle muestra
el club organizador; deportes nuevos: billar, trec, triatlon, gimnasia ritmica, pelota y trail.
v6.38: rediseño de la portada y del detalle con más aire y menos líneas y cajas: filtros como texto, días subrayados, filas sin
separadores ni barras, entrada como palabra de color, sin leyenda, publicidad solo si hay anuncios y detalle en líneas de texto con el
cartel arriba.
v6.39: las filas con lugar o nombres largos ya no ensanchan la lista (la palabra Gratis quedaba fuera de la pantalla).
-->

<body>
<div id="splashOv" class="splash-ov" onclick="closeSplash()">
  <div class="splash-card" onclick="event.stopPropagation()">
    <img class="splash-logo" src="/assets/img/logo.png" alt="Kirolorik">
    <div class="splash-eus">Kirolik ez, zalerik gabe</div>
    <div class="splash-cas">Sin afición, no hay deporte</div>
    <button class="splash-btn" onclick="closeSplash()">Harmailetara! 🏟️</button>
  </div>
</div>
<div class="app">
  <div class="top-bar">
    <div class="logo logo-wrap"><img src="/assets/img/logo.png" alt="" class="logo-img" onerror="this.style.display='none'"> Kirolorik</div>
    <div class="top-actions">
      <div class="location-pill" onclick="openMun()"><div class="loc-dot"></div><span id="locText">Eibar</span></div>
      <select class="lang-select" id="langSel" onchange="changeLang(this.value)"><option value="cas">CAS</option><option value="eus">EUS</option></select>
      <div class="prof-btn" id="profBtn" onclick="openProf()"><div class="prof-btn-in" id="profBtnIn">👤</div></div>
    </div>
  </div>
  <div class="sport-select-wrap">
    <select id="sportSel" onchange="filterSpSel(this)">
      <option value="todos" data-i18n="nav.todos_deportes">🏅 Todos los deportes</option>
    </select>
    <span class="filt-sep">·</span>
    <select id="clubSel" onchange="filterClubSel(this)">
      <option value="todos" data-i18n="nav.todos_equipos">👕 Todos los equipos</option>
    </select>
  </div>
  <div class="date-strip" id="dates"><div class="date-chip date-arrow" onclick="document.getElementById('dates').scrollBy({left:-80,behavior:'smooth'})">‹</div></div>
  <div class="parrilla-wrap"><div class="parrilla" id="grid"><div class="empty-slot">Cargando...</div></div></div>
</div>
<div class="bottom-bar">
  <div class="ad-wrap" id="adWrap">
    <div class="ad-bar" onclick="toggleAd()">

function gs(d){return SP[(d||'').toLowerCase()]||{c:'var(--c-otros)',e:'🏅'}}
function td(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nm(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function fd(iso){if(!iso)return'';var p=iso.split('-'),dt=new Date(p[0],p[1]-1,p[2]);return t('dias')[dt.getDay()]+' '+p[2]+' '+t('meses')[p[1]-1]+' '+p[0]}
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
// Solo URLs http(s): evita javascript: y similares en src/href
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:''}
function en(e){return esc(e.nombre_evento||(e.equipo_local||'—')+(e.equipo_visitante?' – '+e.equipo_visitante:''))}
function bg(tp){

}

// DATES
function buildDates(){
  var strip=document.getElementById('dates');
  var hoy=new Date();
  for(var i=0;i<14;i++){
    var d=new Date(hoy);d.setDate(hoy.getDate()+i);
    var iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var chip=document.createElement('div');
    chip.className='date-chip'+(iso===fechaSel?' today':'');
    chip.setAttribute('data-fecha',iso);
    chip.setAttribute('data-dow',d.getDay());
    chip.innerHTML='<span class="dn">'+t('dias')[d.getDay()]+'</span><span class="dd">'+d.getDate()+'</span>';
    (function(myIso,myChip){
      myChip.onclick=function(){
        var all=document.querySelectorAll('.date-chip:not(.date-arrow)');
        for(var j=0;j<all.length;j++)all[j].classList.remove('today');
        if(fechaSel===myIso){
          // Deseleccionar → vista agrupada
          fechaSel=null;
        }else{
          myChip.classList.add('today');
          fechaSel=myIso;
        }
        loadGrid();
      };
    })(iso,chip);
    strip.appendChild(chip);
  }
}

function filterSpSel(sel){deporteSel=sel.value;loadGrid()}
function filterClubSel(sel){
  clubSel=sel.value;
  if(clubSel!=='todos'){
    // Modo seguimiento: sin fecha ni municipio
    fechaSel=null;
    muni='';
    document.getElementById('locText').textContent='Todos';
    var chips=document.querySelectorAll('.date-chip:not(.date-arrow)');
    for(var i=0;i<chips.length;i++)chips[i].classList.remove('today');
  }else{
    // Volver al modo normal: hoy + municipio guardado
    fechaSel=hoyISO;
    try{var sm=localStorage.getItem('kb_municipio');if(sm)muni=sm;}catch(e){}
    if(!muni)muni='Eibar';
    document.getElementById('locText').textContent=muni||'Municipios';
    var chips=document.querySelectorAll('.date-chip:not(.date-arrow)');
    for(var i=0;i<chips.length;i++){
      chips[i].classList.remove('today');
      if(chips[i].getAttribute('data-fecha')===fechaSel)chips[i].classList.add('today');
    }
  }
  loadGrid();
}

// GRID
var gridSeq=0;
// Cambia el día seleccionado y marca su chip (si el día queda fuera de las 14 fechas, no se marca ninguno)
function setFechaSel(iso){
  fechaSel=iso;
  var chips=document.querySelectorAll('.date-chip:not(.date-arrow)');
  for(var i=0;i<chips.length;i++){
    if(iso&&chips[i].getAttribute('data-fecha')===iso)chips[i].classList.add('today');
    else chips[i].classList.remove('today');
  }
}
function loadGrid(){
  var mySeq=++gridSeq;
  var g=document.getElementById('grid');
  g.innerHTML='<div class="empty-slot">'+t('grid.cargando')+'</div>';
  var _gridFechaSel=fechaSel;
  var url=SB+'/rest/v1/eventos?select=*,mis_equipos(escudo_url,nombre,clubes(escudo_url))&activo=eq.true&order=fecha.asc,hora.asc';
  url+='&fecha=gte.'+(fechaSel||td());
  if(deporteSel!=='todos')url+='&deporte=eq.'+encodeURIComponent(deporteSel);
  url+='&test=eq.false';
  if(muni)url+='&municipio=eq.'+encodeURIComponent(muni);
  fetch(url,{headers:H}).then(function(r){return r.json()}).then(function(data){
    if(clubSel==='todos'||!Array.isArray(data))return data;
    return cargarClubes().then(function(){return data.filter(function(e){return eventoDeClub(e,clubSel)})});
  }).then(function(data){
    if(mySeq!==gridSeq)return;
    if(!data||!data.length){g.innerHTML='<div class="empty-slot">'+t('grid.sin_eventos')+'</div>';return}
    var now=new Date();
    var filtered=[];
    for(var i=0;i<data.length;i++){
      var e=data[i];
      if(fechaSel){if(e.fecha===fechaSel)filtered.push(e);continue}
      var hp=(e.hora||'00:00').split(':');
      var st=new Date(e.fecha+'T'+hp[0].padStart(2,'0')+':'+hp[1].padStart(2,'0')+':00');
      var fin=new Date(st.getTime()+(e.duracion_minutos||90)*60000);
      if(fin>now)filtered.push(e);
    }
    // Si hoy no tiene eventos, avanzar al próximo día con eventos
    if(!filtered.length && fechaSel){
      var nextDay=null;
      for(var i=0;i<data.length;i++){
        var ef=data[i];
        if(ef.fecha>fechaSel){nextDay=ef.fecha;break;}
      }
      if(nextDay){
        fechaSel=nextDay;
        var allChips=document.querySelectorAll('.date-chip:not(.date-arrow)');
        for(var ci=0;ci<allChips.length;ci++){
          var c=allChips[ci];
          if(c.getAttribute('data-fecha')===nextDay){c.classList.add('today');}
          else{c.classList.remove('today');}
        }
        // re-filter with new day
        filtered=[];
        for(var i=0;i<data.length;i++){if(data[i].fecha===nextDay)filtered.push(data[i]);}
      }
    }
    evCache=filtered;
    if(!filtered.length){
      // Si filtramos por día y no hay eventos, saltar al próximo día con eventos
      if(_gridFechaSel&&data.length){
        var nextDates=data.map(function(e){return e.fecha}).filter(function(f){return f>_gridFechaSel});
        nextDates.sort();
        if(nextDates.length){
          var nextDate=nextDates[0];
          var chips=document.querySelectorAll('.date-chip:not(.date-arrow)');
          for(var i=0;i<chips.length;i++){
            chips[i].classList.remove('today');
            if(chips[i].getAttribute('data-fecha')===nextDate){chips[i].classList.add('today');}
          }
          fechaSel=nextDate;
          loadGrid();return;
        }
      }
      g.innerHTML='<div class="empty-slot">'+t('grid.sin_eventos')+'</div>';return;
    }
    var curTime=nm(),hoy=td();
    g.innerHTML='';
    function renderEventCard(e,evCache){
      var d=gs(e.deporte),dl=esc(e.deporte||'Otro');
      var gen=e.genero&&e.genero!=='Sin especificar'?' '+esc(e.genero.toLowerCase()):'';
      var idx=evCache.indexOf(e);
      var cat=(esc(e.categoria||'')+gen).trim();
      var lugar=e.instalacion?esc(e.instalacion):'';
      return '<div class="event" onclick="openDet('+idx+')"><div class="event-info"><div class="event-teams">'+en(e)+'</div><div class="event-meta"><span class="event-sport" style="color:'+d.c+'">'+dl+'</span>'+(cat?'<span class="event-sep">·</span><span class="event-cat">'+cat+'</span>':'')+(lugar?'<span class="event-sep">·</span><span class="event-cat">'+lugar+'</span>':'')+'</div></div>'+bg(e.tipo_entrada)+'</div>';
    }
    if(fechaSel){
      // Vista horaria (día seleccionado)
      var groups={};
      for(var i=0;i<filtered.length;i++){var e=filtered[i];var h=(e.hora||'00:00').slice(0,5);if(!groups[h])groups[h]=[];groups[h].push(e);}
      var nowDone=false;
      var keys=Object.keys(groups).sort();
      var dh=document.createElement('div');dh.className='day-sep';dh.innerHTML='<div class="day-sep-label">'+fd(fechaSel)+'</div>';g.appendChild(dh);
      for(var k=0;k<keys.length;k++){
        var hora=keys[k],evs=groups[hora],hh=hora.split(':')[0],mm=hora.split(':')[1];
        if(!nowDone&&hora>curTime&&fechaSel===hoy){nowDone=true;var nr=document.createElement('div');nr.className='now-row';nr.innerHTML='<div class="now-dot"></div><div class="now-label">'+t('grid.ahora')+'</div><div class="now-time">'+curTime+'</div>';g.appendChild(nr);}
        var row=document.createElement('div');row.className='time-row';
        var eh='';
        for(var j=0;j<evs.length;j++)eh+=renderEventCard(evs[j],evCache);
        row.innerHTML='<div class="time-col"><span class="time-h">'+hh+'</span><span class="time-m">'+mm+'</span></div><div class="events-col">'+eh+'</div>';
        g.appendChild(row);
      }
    }else{
      // Vista agrupada por día (sin fecha seleccionada)
      var dayGroups={};
      for(var i=0;i<filtered.length;i++){var e=filtered[i];var f=e.fecha;if(!dayGroups[f])dayGroups[f]=[];dayGroups[f].push(e);}
      var days=Object.keys(dayGroups).sort();
      for(var d=0;d<days.length;d++){
        var day=days[d],dayEvs=dayGroups[day];
        // Separador de día
        var sep=document.createElement('div');sep.className='day-sep';
        sep.innerHTML='<div class="day-sep-line"></div><div class="day-sep-label">'+fd(day)+'</div><div class="day-sep-line"></div>';
        g.appendChild(sep);
        // Eventos del día agrupados por hora
        var hGroups={};
        for(var i=0;i<dayEvs.length;i++){var e=dayEvs[i];var h=(e.hora||'00:00').slice(0,5);if(!hGroups[h])hGroups[h]=[];hGroups[h].push(e);}
        var hKeys=Object.keys(hGroups).sort();
        for(var k=0;k<hKeys.length;k++){
          var hora=hKeys[k],evs=hGroups[hora],hh=hora.split(':')[0],mm=hora.split(':')[1];
          var row=document.createElement('div');row.className='time-row';
          var eh='';
          for(var j=0;j<evs.length;j++)eh+=renderEventCard(evs[j],evCache);
          row.innerHTML='<div class="time-col"><span class="time-h">'+hh+'</span><span class="time-m">'+mm+'</span></div><div class="events-col">'+eh+'</div>';
          g.appendChild(row);
        }
      }
    }
  }).catch(function(err){if(mySeq!==gridSeq)return;g.innerHTML='<div class="empty-slot" style="color:#dc2626">'+t('grid.error')+': '+esc(err.message)+'</div>'});
}

  tic:'<svg viewBox="0 0 24 24"><path d="M4 9a2 2 0 0 0 0 6v3h16v-3a2 2 0 0 1 0-6V6H4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg>',
  org:'<svg viewBox="0 0 24 24"><path d="M5 21V4h11l-1.5 4L16 12H5"/></svg>'
};

  var e=evCache[idx];if(!e)return;

  else{var escLocal=escudo?'<img class="det-escudo" src="'+esc(escudo)+'" alt="" onerror="this.outerHTML=\'<div style=&quot;font-size:28px&quot;>'+d.e+'</div>\'">':'<div style="font-size:28px">'+d.e+'</div>';vs='<div class="det-vs"><div class="det-team">'+escLocal+'<div class="det-team-name">'+esc(e.equipo_local||'—')+'</div></div><div class="det-vs-sep">VS</div><div class="det-team"><div id="detVisEsc" style="font-size:28px">'+d.e+'</div><div class="det-team-name">'+esc(e.equipo_visitante||'—')+'</div></div></div>';}
  var mq=encodeURIComponent((e.instalacion||'')+(e.municipio?', '+e.municipio:''));

  var lugarTxt=[e.instalacion,e.municipio].filter(Boolean).join(', ');
  var pin=lugarTxt?'<div class="d-line d-click" data-u="'+esc(mu)+'" onclick="window.open(this.getAttribute(\'data-u\'),\'_blank\')">'+DET_IC.pin+'<span><b>'+esc(lugarTxt)+'</b><small class="acc">'+t('det.ver_maps')+'</small></span></div>':'';
  var entTxt={gratis:t('det.entrada_libre'),pago:t('det.entrada_pago'),rifa:t('det.entrada_rifa'),puertas:t('det.puertas_abiertas')}[e.tipo_entrada];
  var ent=entTxt?'<div class="d-line">'+DET_IC.tic+'<span class="d-ent '+esc(e.tipo_entrada)+'">'+entTxt+(e.tipo_entrada==='puertas'?'<small>'+t('det.acceso_libre')+'</small>':'')+'</span></div>':'';
  var orgClub=e.organizador_id?clubesData.byId[e.organizador_id]:null;
  var orgLine=orgClub?'<div class="d-line">'+DET_IC.org+'<span>'+t('det.organiza')+': '+esc(nombreClub(orgClub))+'</span></div>':'';
  var info=e.info_evento?'<div class="d-sec"><h3>'+t('det.sobre_evento')+'</h3><p>'+esc(e.info_evento)+'</p></div>':'';
  var cartel=safeUrl(e.imagen_url);
  var poster=cartel?'<div class="d-poster" onclick="openLb(evCache['+idx+'].imagen_url)"><img src="'+esc(cartel)+'" alt="" loading="lazy"></div>':'';
  var partsHtml='';
  if(e.participantes&&e.participantes.trim()){
    var parts=e.participantes.split('\n').map(function(p){return p.trim()}).filter(function(p){return p});
    if(parts.length)partsHtml='<div class="d-sec"><h3>'+t('det.participantes')+'</h3><ul>'+parts.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul></div>';
  }
  var upd=e.updated_at?'<div class="d-upd">'+t('det.ultima_act')+' '+fd(e.updated_at.split('T')[0])+'</div>':'';
  document.getElementById('detScroll').innerHTML=poster+'<div class="d-head">'+kicker+vs+'</div><div class="d-lines">'+cal+pin+ent+orgLine+'</div>'+info+partsHtml+upd;
  if(e.equipo_visitante_id&&!e.nombre_evento){
    fetch(SB+'/rest/v1/mis_equipos?id=eq.'+encodeURIComponent(e.equipo_visitante_id)+'&select=escudo_url,clubes(escudo_url)',{headers:H}).then(function(r){return r.json()}).then(function(rows){
      var u=rows&&rows[0]?escudoEq(rows[0]):'';
      var box=document.getElementById('detVisEsc');
      if(u&&box&&mySeq===detSeq)box.innerHTML='<img class="det-escudo" src="'+esc(u)+'" alt="">';
    }).catch(function(){});
  }
  document.getElementById('detDraw').classList.add('open');
  document.getElementById('profDraw').classList.remove('open');
  document.getElementById('profBtn').classList.remove('open');
  closeProf();
}

// MUNICIPIO
function openMun(){closeProf();closeDet();document.getElementById('munDraw').classList.add('open');document.getElementById('ov').classList.add('open');loadMunis()}
function closeMun(){document.getElementById('munDraw').classList.remove('open');document.getElementById('ov').classList.remove('open')}
function loadMunis(){
  var list=document.getElementById('munList');list.innerHTML='<div class="empty-slot">Cargando...</div>';
  var today=new Date().toISOString().split('T')[0];
  fetch(SB+'/rest/v1/eventos?select=municipio&activo=eq.true&test=eq.false&fecha=gte.'+today,{headers:H}).then(function(r){return r.json()}).then(function(data){
    // Extraer municipios únicos y ordenarlos
    var seen={};var unique=[];
    (data||[]).forEach(function(e){if(e.municipio&&!seen[e.municipio]){seen[e.municipio]=true;unique.push({nombre:e.municipio})}});
    unique.sort(function(a,b){return a.nombre.localeCompare(b.nombre)});
    data=unique;
    if(!data||!data.length){list.innerHTML='<div class="empty-slot">'+t('grid.sin_municipios')+'</div>';return}
    var html='';
    html+='<div class="mun-item'+(!muni?' sel':'')+'" onclick="selMun(\'\')" ><div style="font-size:18px;width:28px;text-align:center">🗺️</div><div style="flex:1"><div class="mun-name">'+t('nav.todos_municipios')+'</div><div class="mun-prov">'+t('nav.sin_filtro_ubi')+'</div></div><div>'+(!muni?'✅':'')+'</div></div>';
    for(var i=0;i<data.length;i++){var m=data[i];html+='<div class="mun-item'+(m.nombre===muni?' sel':'')+'" data-mun="'+esc(m.nombre)+'" onclick="selMun(this.getAttribute(\'data-mun\'))">'+'<div style="font-size:18px;width:28px;text-align:center">📍</div><div style="flex:1"><div class="mun-name">'+esc(m.nombre)+'</div></div><div>'+(m.nombre===muni?'✅':'')+'</div></div>'}
    list.innerHTML=html;
  }).catch(function(){list.innerHTML='<div class="empty-slot" style="color:#dc2626">'+t('grid.error')+'</div>'});
}
function populateClubSelect(){
  var today=new Date().toISOString().split('T')[0];
  var url=SB+'/rest/v1/eventos?select=equipo_id,equipo_visitante_id,organizador_id&activo=eq.true&test=eq.false&fecha=gte.'+today+(muni?'&municipio=eq.'+encodeURIComponent(muni):'');
  Promise.all([fetch(url,{headers:H}).then(function(r){return r.json()}),cargarClubes()]).then(function(res){
    var data=Array.isArray(res[0])?res[0]:[];
    var seen={},clubs=[];
    function add(id){if(id&&!seen[id]&&clubesData.byId[id]){seen[id]=true;clubs.push(id);}}
    for(var i=0;i<data.length;i++){
      add(clubesData.teamClub[data[i].equipo_id]);
      add(clubesData.teamClub[data[i].equipo_visitante_id]);
      add(data[i].organizador_id);
    }
    clubs.sort(function(a,b){return nombreClub(clubesData.byId[a]).localeCompare(nombreClub(clubesData.byId[b]),'es')});
    var sel=document.getElementById('clubSel');if(!sel)return;
    var cur=sel.value;
    sel.innerHTML='<option value="todos">'+t('nav.todos_equipos')+'</option>';
    for(var i=0;i<clubs.length;i++){var o=document.createElement('option');o.value=clubs[i];o.textContent=nombreClub(clubesData.byId[clubs[i]]);sel.appendChild(o);}
    if(cur&&cur!=='todos')sel.value=cur;
  }).catch(function(){});
}

function selMun(name){muni=name;if(fechaSel)setFechaSel(hoyISO);try{localStorage.setItem('kb_municipio',name)}catch(e){}document.getElementById('locText').textContent=name||t('nav.municipios');closeMun();populateSpSelect();populateClubSelect();deporteSel='todos';clubSel='todos';document.getElementById('sportSel').value='todos';document.getElementById('clubSel').value='todos';loadGrid()}

// PERFIL
function openProf(){closeMun();closeDet();renderProf();document.getElementById('profDraw').classList.add('open');document.getElementById('ov').classList.add('open')}
function closeProf(){document.getElementById('profDraw').classList.remove('open');document.getElementById('ov').classList.remove('open')}
function renderProf(){

    var isAdm=(em==='kirolorik.app@gmail.com');b.innerHTML='<button class="prof-item" onclick="goTo(\'/pages/perfil.html\')">👤 Mi perfil</button><div class="prof-sep"></div><button class="prof-item accent" onclick="goTo(\'/admin/eventos.html\')">📋 Gestionar eventos</button>'+(isAdm?'<div class="prof-sep"></div><button class="prof-item accent" onclick="goTo(\'/admin/panel.html\')">🛠️ Panel de control</button>':'')+'<div class="prof-sep"></div><button class="prof-item danger" onclick="doLogout()">🚿 A la ducha</button>';
  }else{

    if(modoRec){
      b.innerHTML='<div class="prof-login"><div style="font-size:13px;font-weight:700;margin-bottom:4px">Recuperar contraseña</div><div class="field"><label>Email</label><input type="email" id="recMail" placeholder="correo@ejemplo.com" data-i18n-attr="placeholder" data-i18n="prof.placeholder_email"></div><div class="login-err" id="recErr"></div><button class="btn-kick" onclick="sendRec()">Enviar enlace ⚽</button><div class="login-link" onclick="modoRec=false;renderProf()">← Volver</div></div>';
    }else{
      b.innerHTML='<div class="prof-login"><div class="field"><label>Email</label><input type="email" id="loginMail" placeholder="correo@ejemplo.com" data-i18n-attr="placeholder" data-i18n="prof.placeholder_email"></div><div class="field"><label>Password</label><input type="password" id="loginPass" placeholder="" onkeydown="if(event.key===\'Enter\')doLogin()"></div><div class="login-err" id="loginErr"></div><button class="btn-kick" id="loginBtn" onclick="doLogin()">Entra</button><div class="login-link" onclick="modoRec=true;renderProf()">¿Olvidaste tu contraseña?</div><div class="prof-sep" style="margin:4px 0"></div><div class="login-contact">¿Quieres registrar tu club? kirolorik.info@gmail.com</div></div>';
    }
  }
}

// AUTH
function doLogin(){
  var em=document.getElementById('loginMail'),pw=document.getElementById('loginPass'),er=document.getElementById('loginErr'),bt=document.getElementById('loginBtn');
  if(!em||!pw)return;if(!em.value.trim()||!pw.value){if(er)er.textContent=t('prof.error_campos');return}
  if(bt){bt.disabled=true;bt.textContent='...'}
  fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SK,'Content-Type':'application/json'},body:JSON.stringify({email:em.value.trim(),password:pw.value})}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error_description||'Error');authToken=d.access_token;authUser=d.user;try{sessionStorage.setItem('kb_token',authToken);sessionStorage.setItem('kb_user',JSON.stringify(authUser));if(d.refresh_token)sessionStorage.setItem('kb_refresh',d.refresh_token)}catch(e){}modoRec=false;renderProf()})}).catch(function(e){if(er)er.textContent=e.message;if(bt){bt.disabled=false;bt.textContent=t('prof.entrar')}});
}
function sendRec(){var em=document.getElementById('recMail'),er=document.getElementById('recErr');if(!em||!em.value.trim()){if(er)er.textContent='Introduce tu email';return}fetch(SB+'/auth/v1/recover',{method:'POST',headers:{'apikey':SK,'Content-Type':'application/json'},body:JSON.stringify({email:em.value.trim()})}).then(function(){if(er){er.style.color='#16a34a';er.textContent=t('prof.check_correo')}}).catch(function(e){if(er)er.textContent=e.message})}
function doLogout(){fetch(SB+'/auth/v1/logout',{method:'POST',headers:{'apikey':SK,'Authorization':'Bearer '+authToken}}).catch(function(){});authUser=null;authToken=null;try{sessionStorage.removeItem('kb_token');sessionStorage.removeItem('kb_user');sessionStorage.removeItem('kb_refresh')}catch(e){}renderProf();closeProf()}
function goTo(url){closeProf();window.location.href=url}

// BANNERS
function loadAds(){
  fetch(SB+'/rest/v1/banners?select=*&activo=eq.true&order=orden.asc',{headers:H}).then(function(r){return r.json()}).then(function(data){
    adList=data||[];
    // Orden aleatorio
    for(var i=adList.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=adList[i];adList[i]=adList[j];adList[j]=tmp}
    if(adList.length){var aw=document.getElementById('adWrap');if(aw)aw.classList.add('on');renderAdBar();renderAdDots();if(adOpen){try{localStorage.setItem('kb_ad_seen','1')}catch(e){};renderAdPanel();setTimeout(function(){document.getElementById('adPanel').classList.add('open')},30);}}
  }).catch(function(){});
}
function renderAdBar(){if(!adList.length)return;var b=adList[adIdx];document.getElementById('adName').textContent=b.nombre||'';var d=b.descripcion||'';document.getElementById('adShort').textContent=d.length>60?d.substring(0,60)+'...':d;if(adOpen)renderAdPanel()}
function renderAdDots(){var html='';for(var i=0;i<adList.length;i++)html+='<div class="ad-dot'+(i===adIdx?' on':'')+'" onclick="goAd('+i+')"></div>';document.getElementById('adDots').innerHTML=html}
function renderAdPanel(){var b=adList[adIdx];var p=document.getElementById('adPanel');var adImg=safeUrl(b.imagen_url);var img=adImg?'<img class="ad-img" src="'+esc(adImg)+'" alt="" loading="lazy">':'<div class="ad-ph"><div style="font-size:32px;opacity:0.4">📣</div><div style="font-size:11px;color:var(--muted)">Espacio publicitario</div></div>';var dest=b.url_destino||'';if(!safeUrl(dest)&&dest.indexOf('mailto:')!==0&&dest.indexOf('tel:')!==0)dest='mailto:kirolorik.info@gmail.com?subject=Publicidad en Kirolorik';var ext=(dest.indexOf('mailto:')!==0&&dest.indexOf('tel:')!==0);p.innerHTML=img+'<div class="ad-footer"><div class="ad-long">'+esc(b.texto||b.descripcion||'')+'</div><a class="ad-cta" href="'+esc(dest)+'"'+(ext?' target="_blank" rel="noopener noreferrer"':'')+' onclick="registrarClicBanner('+JSON.stringify(String(b.id)).replace(/"/g,'&quot;')+')">Contactar</a><div class="ad-close" onclick="toggleAd()">✕</div></div>'}
function toggleAd(){adOpen=!adOpen;if(!adOpen)try{localStorage.setItem('kb_ad_seen','1')}catch(e){};var p=document.getElementById('adPanel');if(adOpen){renderAdPanel();p.classList.add('open')}else p.classList.remove('open')}
function navAd(dir){if(!adList.length)return;adIdx=(adIdx+dir+adList.length)%adList.length;renderAdBar();renderAdDots()}
function goAd(i){adIdx=i;renderAdBar();renderAdDots()}
