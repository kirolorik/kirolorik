<style>
/* ── BANNER EXPANDIBLE ── */
.ad-wrap{flex-shrink:0;border-top:1px solid var(--border);background:var(--surface);overflow:hidden}
.ad-bar{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;cursor:pointer;position:relative;
  transition:background 0.15s;min-height:54px;
}
.ad-bar:hover{background:var(--surface2)}
.ad-tag{position:absolute;top:3px;right:10px;font-size:7px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.ad-logo{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ad-body{flex:1;min-width:0}
.ad-name{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-desc-short{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ad-nav{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ad-arrow{
  width:26px;height:26px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;color:var(--text2);
  transition:all 0.15s;flex-shrink:0;
}
.ad-arrow:hover{border-color:var(--accent);color:var(--accent)}
.ad-dots{display:flex;gap:4px;align-items:center;padding:0 4px}
.ad-dot{width:5px;height:5px;border-radius:50%;background:var(--border);transition:background 0.2s;cursor:pointer}
.ad-dot.on{background:var(--accent)}

/* Panel expandido */
.ad-panel{
  max-height:0;overflow:hidden;
  transition:max-height 0.35s cubic-bezier(.4,0,.2,1);
  border-top:0px solid var(--border);
}
.ad-panel.open{max-height:320px;border-top:1px solid var(--border)}
.ad-panel-inner{padding:0}
.ad-img{width:100%;max-height:200px;object-fit:cover;display:block}
.ad-img-placeholder{
  width:100%;height:140px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;
}
.ad-img-placeholder-ico{font-size:32px;opacity:0.4}
.ad-img-placeholder-txt{font-size:11px;color:var(--muted)}
.ad-panel-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;
}
.ad-desc-long{font-size:12px;color:var(--text2);line-height:1.5;flex:1;padding-right:10px}
.ad-cta{
  background:var(--accent);color:var(--accent-txt);
  font-size:10px;font-weight:800;border-radius:var(--radius-sm);
  padding:7px 12px;flex-shrink:0;text-decoration:none;
  text-transform:uppercase;white-space:nowrap;
}
.ad-close{
  width:28px;height:28px;border-radius:50%;
  border:1px solid var(--border);background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;color:var(--muted);
  transition:all 0.15s;flex-shrink:0;margin-left:6px;
}
.ad-close:hover{border-color:var(--accent);color:var(--accent)}
.lang-select{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:6px 8px;
  font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;
  color:var(--text);outline:none;cursor:pointer;
  height:32px;
}
.lang-select:focus{border-color:var(--accent)}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;opacity:0;pointer-events:none;transition:opacity 0.25s}
.overlay.open{opacity:1;pointer-events:all}

/* DRAWER PERFIL (derecha) */
.profile-drawer{position:fixed;top:0;right:-290px;width:290px;height:100%;background:var(--surface);border-left:1px solid var(--border);z-index:201;transition:right 0.3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden;box-shadow:-4px 0 24px rgba(0,0,0,0.12)}
.profile-drawer.open{right:0}
.drawer-header{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.drawer-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;margin-bottom:10px}
.drawer-avatar.guest{background:var(--surface2);color:var(--muted);font-size:22px}
.drawer-hola{font-size:15px;font-weight:700;color:var(--text)}
.drawer-sub{font-size:12px;color:var(--muted);margin-top:2px}
.drawer-body{flex:1;overflow-y:auto;padding:10px 0}
.drawer-item{display:flex;align-items:center;gap:12px;padding:13px 20px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;transition:background 0.15s;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif}
.drawer-item:hover{background:var(--surface2)}
.drawer-item.danger{color:#dc2626}
.drawer-item.accent{color:var(--accent)}
.drawer-sep{height:1px;background:var(--border);margin:6px 0}
.drawer-login{padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.drawer-login .field{margin:0}
.btn-kick{background:var(--accent);color:var(--accent-txt);border:none;border-radius:var(--radius-sm);padding:12px;font-size:13px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif;width:100%;transition:opacity 0.2s}
.btn-kick:disabled{opacity:0.5}
.login-error{font-size:11px;color:#dc2626;min-height:14px}
.login-link{font-size:11px;color:var(--accent);cursor:pointer;text-align:center;text-decoration:underline}
.login-contact{font-size:10px;color:var(--muted);text-align:center;line-height:1.5;padding:0 4px}

/* DRAWER DETALLE (izquierda) */
.detail-drawer{position:fixed;top:0;left:-100%;width:100%;max-width:430px;height:100%;background:var(--bg);z-index:201;transition:left 0.3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden;box-shadow:4px 0 24px rgba(0,0,0,0.15)}
.detail-drawer.open{left:0}
.detail-topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.detail-back{font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 6px 2px 0}
.detail-back:hover{color:var(--accent)}
.detail-title{font-size:13px;font-weight:700;color:var(--text);flex:1}
.detail-scroll{flex:1;overflow-y:auto;scrollbar-width:none}
.detail-scroll::-webkit-scrollbar{display:none}
.detail-sport-hero{padding:16px 16px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.detail-sport-bar{height:3px;border-radius:4px;margin-bottom:14px}
.detail-comp-pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-bg);border:1px solid var(--accent);border-radius:20px;padding:3px 10px;margin-bottom:12px}
.detail-comp-text{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px}
.detail-vs{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.detail-team{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.detail-team-name{font-size:12px;font-weight:700;text-align:center;line-height:1.3;color:var(--text)}
.detail-vs-sep{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--muted);flex-shrink:0}
.detail-single-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;color:var(--text);text-align:center}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 16px 0}
.detail-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.detail-cell.clickable{cursor:pointer;transition:border-color 0.15s}
.detail-cell.clickable:hover{border-color:var(--accent)}
.detail-cell-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.detail-cell-val{font-size:13px;font-weight:700;margin-top:2px;line-height:1.2;color:var(--text)}
.detail-cell-sub{font-size:10px;color:var(--muted);margin-top:1px}
.detail-entry{margin:12px 16px 0;display:flex;align-items:center;gap:10px;border-radius:var(--radius);padding:10px 14px}
.detail-entry-icon{font-size:20px}
.detail-entry-title{font-size:13px;font-weight:700}
.detail-poster-wrap{margin:12px 16px 0;cursor:pointer}
.detail-poster-wrap img{width:100%;border-radius:var(--radius);border:1px solid var(--border);object-fit:cover;max-height:200px}
.detail-poster-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:6px}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity 0.2s}
.lightbox.open{opacity:1;pointer-events:all}
.lightbox img{max-width:100%;max-height:90dvh;border-radius:var(--radius);object-fit:contain}
.lightbox-close{position:absolute;top:16px;right:16px;font-size:24px;color:#fff;cursor:pointer;opacity:0.7}

/* Perfil btn */
.profile-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;flex-shrink:0;border:2px solid var(--border);transition:border-color 0.2s;background:var(--surface2)}
.profile-btn:hover,.profile-btn.open{border-color:var(--accent)}
.profile-btn-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted)}
.profile-btn-initial{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}

.logo-wrap{display:flex;align-items:center;gap:8px}
.logo-img{height:26px;width:auto;flex-shrink:0}

.legal-footer{
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  gap:12px;flex-wrap:wrap;padding:8px 16px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);background:var(--surface);
}
.legal-footer a{font-size:9px;color:var(--muted);text-decoration:none;letter-spacing:0.3px}
.legal-footer a:hover{color:var(--accent)}

.search-results{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.sri{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border);cursor:pointer;font-size:12px}
.sri-name{font-weight:600;flex:1;color:var(--text)}
.sri-sub{font-size:10px;color:var(--muted)}
</style>
</head>

<script>
const SB_URL='https://glscnwctcvrosmbrljns.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdsc2Nud2N0Y3Zyb3NtYnJsam5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTcyNjksImV4cCI6MjA5MjYzMzI2OX0.coUfdaThWGrwV8w-MixbWYfgidoi_q_60Y-3KinfeFw';

let authUser=null,authToken=null;
let fechaActiva=null,deporteActivo='todos';
let lang='cas';

const AVATAR_COLORS=['#1a6bff','#16a34a','#dc2626','#9333ea','#ea580c','#0891b2','#db2777'];
const DEPORTES={
  futbol:    {color:'var(--c-futbol)',   emoji:'⚽'},
  basket:    {color:'var(--c-basket)',   emoji:'🏀'},
  balonmano: {color:'var(--c-balonmano)',emoji:'🤾'},
  waterpolo: {color:'var(--c-waterpolo)',emoji:'🏊'},
  boxeo:     {color:'var(--c-boxeo)',    emoji:'🥊'},
  tenis:     {color:'var(--c-tenis)',    emoji:'🎾'},
  atletismo: {color:'var(--c-atletismo)',emoji:'🏃'},
  ciclismo:  {color:'var(--c-ciclismo)', emoji:'🚴'},
  voley:     {color:'#8B5CF6',           emoji:'🏐'},
  natacion:  {color:'#06B6D4',           emoji:'🏊'},
  padel:     {color:'#10B981',           emoji:'🎾'},
  ajedrez:   {color:'#6B7280',           emoji:'♟️'},
  rugby:     {color:'#92400E',           emoji:'🏉'},
  hockey:    {color:'#DC2626',           emoji:'🏒'},
  otros:     {color:'var(--c-otros)',    emoji:'🏅'}
};

// Deporte no conocido: color y emoji genéricos
function getDeporte(d){
  return DEPORTES[(d||'').toLowerCase()] || {color:'var(--c-otros)', emoji:'🏅'};
}

function t(k){return i18n(k,lang)}

function aplicarTraducciones(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v=t(el.dataset.i18n);
    if(v!==el.dataset.i18n) el.textContent=v;
  });
  document.querySelectorAll('.event-sport[data-deporte]').forEach(el=>{
    el.textContent=t(el.dataset.deporte)||el.dataset.deporte;
  });
  document.querySelectorAll('.date-chip[data-dow]').forEach(el=>{
    el.querySelector('.dn').textContent=KIROLORIK_I18N[lang].dias[+el.dataset.dow];
  });
}

function setLang(l){
  lang=l;
  sessionStorage.setItem('kb_lang',l);
  aplicarTraducciones();
  renderDrawerPerfil();
}

function getFechaHoy(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getHoraActual(){
  const d=new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function formatFecha(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-');
  const dt=new Date(y,m-1,d);
  return `${KIROLORIK_I18N[lang].dias[dt.getDay()]} ${d} ${KIROLORIK_I18N[lang].meses[m-1]} ${y}`;
}

function badge(tipo){
  if(tipo==='pago')   return `<div class="entry-badge"><div class="entry-paid">€</div><div class="entry-paid-label">${t('entrada')}</div></div>`;
  if(tipo==='rifa')   return `<div class="entry-badge"><div class="entry-raffle">🎟️</div><div class="entry-raffle-label">${t('rifa')}</div></div>`;
  if(tipo==='gratis') return `<div class="entry-badge"><div class="entry-free">FREE</div><div class="entry-free-label">${t('gratis')}</div></div>`;
  return '<div class="entry-badge"><div class="entry-none"></div></div>';
}

function nombreEvento(e){
  if(e.nombre_evento) return e.nombre_evento;
  return (e.equipo_local||'—')+(e.equipo_visitante?' · '+e.equipo_visitante:'');
}

// ── PARRILLA ──
async function cargar(){
  const parrilla=document.getElementById('parrilla');
  parrilla.innerHTML=`<div class="empty-slot">${t('cargando')}</div>`;
  let url=`${SB_URL}/rest/v1/eventos?select=*&activo=eq.true&order=fecha.asc,hora.asc`;
  if(fechaActiva) url+=`&fecha=eq.${fechaActiva}`;
  else url+=`&fecha=gte.${getFechaHoy()}`;
  if(deporteActivo!=='todos') url+=`&deporte=eq.${deporteActivo}`;
  // Filtro por municipio
  if(municipioActual) url+=`&municipio=eq.${encodeURIComponent(municipioActual)}`;
  try{
    const res=await fetch(url,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    const data=await res.json();
    const ahora=new Date();
    const hoy=getFechaHoy();
    const filtered=data.filter(e=>{
      if(fechaActiva) return true;
      const [h,m]=(e.hora||'00:00:00').split(':');
      const inicio=new Date(e.fecha+'T'+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':00');
      return new Date(inicio.getTime()+(e.duracion_minutos||90)*60000)>ahora;
    });
    if(!Array.isArray(filtered)||!filtered.length){
      parrilla.innerHTML=`<div class="empty-slot">${t('sinEventos')}</div>`;
      return;
    }
    const grupos={};
    filtered.forEach(e=>{
      const h=(e.hora||'00:00').slice(0,5);
      if(!grupos[h]) grupos[h]=[];
      grupos[h].push(e);
    });
    const horaActual=getHoraActual();
    let nowInserted=false;
    parrilla.innerHTML='';
    Object.entries(grupos).forEach(([hora,evs])=>{
      const [hh,mm]=hora.split(':');
      if(!nowInserted&&hora>horaActual&&(!fechaActiva||fechaActiva===hoy)){
        nowInserted=true;
        const now=document.createElement('div');
        now.className='now-row';
        now.innerHTML=`<div class="now-dot"></div><div class="now-label">${t('ahora')}</div><div class="now-time">${horaActual}</div>`;
        parrilla.appendChild(now);
      }
      const row=document.createElement('div');
      row.className='time-row';
      const evHTML=evs.map(e=>{
        const dep=getDeporte(e.deporte);
        const depLabel=t(e.deporte)||e.deporte||'Otro';
        const gen=e.genero&&e.genero!=='Sin especificar'?' · '+e.genero:'';
        return `<div class="event" onclick='abrirDetalle(${JSON.stringify(e).replace(/'/g,"&#39;")})'>
          <div class="event-bar" style="background:${dep.color}"></div>
          <div class="event-info">
            <div class="event-teams">${nombreEvento(e)}</div>
            <div class="event-meta">
              <span class="event-sport" data-deporte="${e.deporte}" style="color:${dep.color}">${depLabel}</span>
              <span class="event-sep">·</span>
              <span class="event-cat">${e.categoria||''}${gen}</span>
            </div>
          </div>
          ${badge(e.tipo_entrada)}
        </div>`;
      }).join('');
      row.innerHTML=`<div class="time-col"><span class="time-h">${hh}</span><span class="time-m">${mm}</span></div><div class="events-col">${evHTML}</div>`;
      parrilla.appendChild(row);
    });
  }catch(err){
    parrilla.innerHTML=`<div class="empty-slot" style="color:#dc2626">Error: ${err.message}</div>`;
  }
}

// ── DETALLE ──
function abrirDetalle(e){
  const dep=getDeporte(e.deporte);
  const depLabel=t(e.deporte)||e.deporte;
  document.getElementById('detailTitleBar').textContent=depLabel+' · '+formatFecha(e.fecha);

  let entradaHTML='';
  if(e.tipo_entrada==='gratis') entradaHTML=`<div class="detail-entry" style="background:rgba(22,163,74,0.06);border:1px solid rgba(22,163,74,0.2)"><div class="detail-entry-icon">🟢</div><div><div class="detail-entry-title" style="color:#16a34a">${t('entradaLibre')}</div></div></div>`;
  else if(e.tipo_entrada==='pago') entradaHTML=`<div class="detail-entry" style="background:rgba(234,179,8,0.06);border:1px solid rgba(234,179,8,0.25)"><div class="detail-entry-icon">€</div><div><div class="detail-entry-title" style="color:#b45309">${t('entradaPago')}</div></div></div>`;
  else if(e.tipo_entrada==='rifa') entradaHTML=`<div class="detail-entry" style="background:rgba(249,115,22,0.06);border:1px solid rgba(249,115,22,0.2)"><div class="detail-entry-icon">🎟️</div><div><div class="detail-entry-title" style="color:#ea580c">${t('entradaRifa')}</div></div></div>`;

  let vsHTML='';
  if(e.nombre_evento) vsHTML=`<div class="detail-single-name">${dep.emoji} ${e.nombre_evento}</div>`;
  else vsHTML=`<div class="detail-vs"><div class="detail-team"><div style="font-size:28px">${dep.emoji}</div><div class="detail-team-name">${e.equipo_local||'—'}</div></div><div class="detail-vs-sep">VS</div><div class="detail-team"><div style="font-size:28px">${dep.emoji}</div><div class="detail-team-name">${e.equipo_visitante||'—'}</div></div></div>`;

  const mapsQ=encodeURIComponent((e.instalacion||'')+(e.municipio?', '+e.municipio:''));
  const mapsURL=`https://www.google.com/maps/search/?api=1&query=${mapsQ}`;
  const posterHTML=e.imagen_url?`<div style="padding:12px 16px 0"><div class="detail-poster-label">${t('poster')}</div><div class="detail-poster-wrap" onclick="abrirLightbox('${e.imagen_url}')"><img src="${e.imagen_url}" alt="Cartel" loading="lazy"></div></div>`:'';
  const gen=e.genero&&e.genero!=='Sin especificar'?` · ${e.genero}`:'';

  document.getElementById('detailScroll').innerHTML=`
    <div class="detail-sport-hero">
      <div class="detail-sport-bar" style="background:${dep.color}"></div>
      <div class="detail-comp-pill"><span class="detail-comp-text">${e.tipo_competicion||'Evento'} · ${e.categoria||''}${gen}</span></div>
      ${vsHTML}
    </div>
    <div class="detail-grid">
      <div class="detail-cell">
        <div class="detail-cell-label">Fecha</div>
        <div class="detail-cell-val">${formatFecha(e.fecha)}</div>
        <div class="detail-cell-sub">${(e.hora||'').slice(0,5)} h · ~${e.duracion_minutos||90} min</div>
      </div>
      <div class="detail-cell clickable" onclick="window.open('${mapsURL}','_blank')">
        <div class="detail-cell-label">Instalación</div>
        <div class="detail-cell-val">${e.instalacion||'—'}</div>
        <div class="detail-cell-sub" style="color:var(--accent)">${t('verMapa')} →</div>
      </div>
      <div class="detail-cell">
        <div class="detail-cell-label">Municipio</div>
        <div class="detail-cell-val">${e.municipio||'—'}</div>
      </div>
      <div class="detail-cell">
        <div class="detail-cell-label">Deporte</div>
        <div class="detail-cell-val">${dep.emoji} ${depLabel}</div>
        <div class="detail-cell-sub">${e.tipo_competicion||''}</div>
      </div>
    </div>
    ${e.updated_at?`<div style="font-size:10px;color:var(--muted);padding:8px 16px 0">* Última actualización: ${formatFecha(e.updated_at.split('T')[0])}</div>`:''}
    ${entradaHTML}
    ${e.info_evento?`<div style="margin:12px 16px 0;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)"><div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:8px">📣 ${t('sobreEvento')}</div><div style="font-size:13px;color:var(--text);line-height:1.6">${e.info_evento}</div></div>`:''}
    ${posterHTML}
    <div style="height:24px"></div>`;

  document.getElementById('detailDrawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  cerrarPerfil();
}

function cerrarDetalle(){document.getElementById('detailDrawer').classList.remove('open');document.getElementById('overlay').classList.remove('open');}
function abrirLightbox(url){document.getElementById('lightboxImg').src=url;document.getElementById('lightbox').classList.add('open');}
function cerrarLightbox(){document.getElementById('lightbox').classList.remove('open');}
function cerrarTodo(){cerrarDetalle();cerrarPerfil();cerrarMunicipio();}

// ── DATES ──
function buildDates(){
  const strip=document.getElementById('dateStrip');
  const hoy=new Date();
  for(let i=0;i<=13;i++){
    const d=new Date(hoy);
    d.setDate(hoy.getDate()+i);
    const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dow=d.getDay();
    const chip=document.createElement('div');
    chip.className='date-chip'+(i===0?' today':'');
    chip.dataset.fecha=iso;
    chip.dataset.dow=dow;
    chip.innerHTML=`<span class="dn">${KIROLORIK_I18N[lang].dias[dow]}</span><span class="dd">${d.getDate()}</span>`;
    chip.onclick=()=>{
      if(chip.classList.contains('today')&&fechaActiva===iso){chip.classList.remove('today');fechaActiva=null;}
      else{document.querySelectorAll('.date-chip:not(.date-arrow)').forEach(c=>c.classList.remove('today'));chip.classList.add('today');fechaActiva=iso;}
      cargar();
    };
    strip.appendChild(chip);
  }
}

function scrollAtras(){document.getElementById('dateStrip').scrollBy({left:-80,behavior:'smooth'});}
function filtrar(chip,dep){document.querySelectorAll('.sp').forEach(s=>s.classList.remove('active'));chip.classList.add('active');deporteActivo=dep;cargar();}

// ── PERFIL ──
function toggleProfile(){
  const d=document.getElementById('profileDrawer');
  if(d.classList.contains('open')){cerrarPerfil();}
  else{
    renderDrawerPerfil();
    d.classList.add('open');
    document.getElementById('overlay').classList.add('open');
    document.getElementById('profileBtn').classList.add('open');
  }
}
function cerrarPerfil(){
  document.getElementById('profileDrawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('profileBtn').classList.remove('open');
}

let modoRecuperar=false;
function renderDrawerPerfil(){
  const header=document.getElementById('drawerHeader');
  const body=document.getElementById('drawerBody');
  if(authUser){
    const email=authUser.email||'';
    const initial=email.charAt(0).toUpperCase();
    const color=AVATAR_COLORS[email.charCodeAt(0)%AVATAR_COLORS.length];
    document.getElementById('profileBtnInner').innerHTML=`<div class="profile-btn-initial" style="background:${color};color:#fff;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700">${initial}</div>`;
    header.innerHTML=`<div class="drawer-avatar" style="background:${color};color:#fff">${initial}</div><div class="drawer-hola">${t('hola')}, ${email.split('@')[0]}</div><div class="drawer-sub">${email}</div>`;
    body.innerHTML=`
      <button class="drawer-item" onclick="irPerfil()">👤 ${t('perfil')}</button>
      <div class="drawer-sep"></div>
      <button class="drawer-item accent" onclick="irAdmin()">📋 ${t('adminEventos')}</button>
      <div class="drawer-sep"></div>
      <button class="drawer-item danger" onclick="logout()">🚿 ${t('logoutBtn')}</button>`;
  } else {
    document.getElementById('profileBtnInner').innerHTML='👤';
    header.innerHTML=`<div class="drawer-avatar guest">👤</div><div class="drawer-hola">${t('invitado')}</div>`;
    if(modoRecuperar){
      body.innerHTML=`<div class="drawer-login">
        <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px">${t('recuperarPass')}</div>
        <div class="field"><label>Email</label><input type="email" id="recEmail" placeholder="${t('emailPlaceholder')}"></div>
        <div class="login-error" id="recError"></div>
        <button class="btn-kick" onclick="enviarRecuperar()">${t('enviarEnlace')}</button>
        <div class="login-link" onclick="modoRecuperar=false;renderDrawerPerfil()">← ${t('volver')}</div>
      </div>`;
    } else {
      body.innerHTML=`<div class="drawer-login">
        <div class="field"><label>Email</label><input type="email" id="drawerEmail" placeholder="${t('emailPlaceholder')}"></div>
        <div class="field"><label>Password</label><input type="password" id="drawerPass" placeholder="${t('passPlaceholder')}" onkeydown="if(event.key==='Enter')login()"></div>
        <div class="login-error" id="drawerError"></div>
        <button class="btn-kick" id="loginBtn" onclick="login()">${t('loginBtn')}</button>
        <div class="login-link" onclick="modoRecuperar=true;renderDrawerPerfil()">${t('olvidastePass')}</div>
        <div class="drawer-sep" style="margin:4px 0"></div>
        <div class="login-contact">${t('registroContacto')}</div>
      </div>`;
    }
  }
}

async function login(){
  const email=document.getElementById('drawerEmail')?.value.trim();
  const pass=document.getElementById('drawerPass')?.value;
  const errEl=document.getElementById('drawerError');
  const btn=document.getElementById('loginBtn');
  if(!email||!pass){if(errEl)errEl.textContent='Rellena email y contraseña';return;}
  if(btn){btn.disabled=true;btn.textContent='...';}
  try{
    const res=await fetch(`${SB_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error_description||'Error');
    authToken=data.access_token;authUser=data.user;
    sessionStorage.setItem('kb_token',authToken);sessionStorage.setItem('kb_user',JSON.stringify(authUser));
    modoRecuperar=false;renderDrawerPerfil();
  }catch(e){if(errEl)errEl.textContent=e.message;if(btn){btn.disabled=false;btn.textContent=t('loginBtn');}}
}

async function enviarRecuperar(){
  const email=document.getElementById('recEmail')?.value.trim();
  const errEl=document.getElementById('recError');
  if(!email){if(errEl)errEl.textContent='Introduce tu email';return;}
  try{
    await fetch(`${SB_URL}/auth/v1/recover`,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email})});
    if(errEl){errEl.style.color='#16a34a';errEl.textContent=t('emailEnviado');}
  }catch(e){if(errEl)errEl.textContent=e.message;}
}

async function logout(){
  await fetch(`${SB_URL}/auth/v1/logout`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+authToken}}).catch(()=>{});
  authUser=null;authToken=null;
  sessionStorage.removeItem('kb_token');sessionStorage.removeItem('kb_user');
  renderDrawerPerfil();cerrarPerfil();
}

function irPerfil(){cerrarPerfil();window.location.href='/pages/perfil.html';}
function irAdmin(){cerrarPerfil();window.location.href='/admin/eventos.html';}

// ── BANNER ──
let banners = [], bannerIdx = 0, bannerOpen = false;

async function cargarBanners(){
  try{
    const res = await fetch(
      `${SB_URL}/rest/v1/banners?select=*&activo=eq.true&order=orden.asc`,
      {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}
    );
    banners = await res.json();
    if(!Array.isArray(banners)||!banners.length) return;
    renderBannerBar();
    renderBannerDots();
  }catch(e){ console.error('Banners:', e); }
}

function renderBannerBar(){
  if(!banners.length) return;
  const b = banners[bannerIdx];
  document.getElementById('adName').textContent = b.nombre || '';
  document.getElementById('adDescShort').textContent = b.descripcion
    ? b.descripcion.substring(0, 60) + (b.descripcion.length > 60 ? '...' : '')
    : '';
  // Si hay panel abierto actualizarlo también
  if(bannerOpen) renderBannerPanel();
}

function renderBannerDots(){
  const dots = document.getElementById('adDots');
  dots.innerHTML = banners.map((_, i) =>
    `<div class="ad-dot ${i===bannerIdx?'on':''}" onclick="irBanner(${i})"></div>`
  ).join('');
}

function renderBannerPanel(){
  const b = banners[bannerIdx];
  const inner = document.getElementById('adPanelInner');
  const imgHTML = b.imagen_url
    ? `<img class="ad-img" src="${b.imagen_url}" alt="${b.nombre}" loading="lazy">`
    : `<div class="ad-img-placeholder"><div class="ad-img-placeholder-ico">📣</div><div class="ad-img-placeholder-txt">Espacio publicitario</div></div>`;
  inner.innerHTML = `
    ${imgHTML}
    <div class="ad-panel-footer">
      <div class="ad-desc-long">${b.descripcion||''}</div>
      <a class="ad-cta" href="${b.url_destino||'#'}" target="_blank">Contactar</a>
      <div class="ad-close" onclick="toggleBanner()">✕</div>
    </div>`;
}

function toggleBanner(){
  bannerOpen = !bannerOpen;
  const panel = document.getElementById('adPanel');
  if(bannerOpen){
    renderBannerPanel();
    panel.classList.add('open');
  } else {
    panel.classList.remove('open');
  }
}

function navBanner(dir){
  if(!banners.length) return;
  bannerIdx = (bannerIdx + dir + banners.length) % banners.length;
  renderBannerBar();
  renderBannerDots();
}

function irBanner(idx){
  bannerIdx = idx;
  renderBannerBar();
  renderBannerDots();
}

// ── MUNICIPIO ──
let municipioActual = localStorage.getItem('kb_municipio') || 'Eibar';

function initMunicipio(){
  document.getElementById('locText').textContent = municipioActual;
}

async function abrirMunicipio(){
  cerrarPerfil();
  cerrarDetalle();
  document.getElementById('municipioDrawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  await cargarMunicipios();
}

function cerrarMunicipio(){
  document.getElementById('municipioDrawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

async function cargarMunicipios(){
  const list = document.getElementById('munList');
  try{
    const res = await fetch(
      `${SB_URL}/rest/v1/municipios?activo=eq.true&order=orden.asc`,
      {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}
    );
    const data = await res.json();
    if(!Array.isArray(data)||!data.length){
      list.innerHTML='<div class="empty-slot">Sin municipios disponibles</div>';
      return;
    }
    list.innerHTML = data.map(m=>`
      <div class="mun-item ${m.nombre===municipioActual?'selected':''}"
           onclick="seleccionarMunicipio('${m.nombre}')">
        <div class="mun-item-ico">📍</div>
        <div style="flex:1">
          <div class="mun-item-name">${m.nombre}</div>
          <div class="mun-item-prov">${m.provincia||''}</div>
        </div>
        <div class="mun-item-check">${m.nombre===municipioActual?'✅':''}</div>
      </div>`).join('');
  }catch(e){
    list.innerHTML='<div class="empty-slot" style="color:#dc2626">Error al cargar municipios</div>';
  }
}

function seleccionarMunicipio(nombre){
  municipioActual = nombre;
  localStorage.setItem('kb_municipio', nombre);
  document.getElementById('locText').textContent = nombre;
  cerrarMunicipio();
  cargar(); // Recargar parrilla con el nuevo municipio
}

const savedUser=sessionStorage.getItem('kb_user');
const savedLang=sessionStorage.getItem('kb_lang');
if(savedToken&&savedUser){authToken=savedToken;authUser=JSON.parse(savedUser);}
if(savedLang){lang=savedLang;document.getElementById('langSelect').value=lang;}
buildDates();cargar();cargarBanners();aplicarTraducciones();renderDrawerPerfil();
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
