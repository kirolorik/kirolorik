<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirolorik · Legal</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f4f6f8;--surface:#fff;--border:#dde1e7;
    --text:#1a1d23;--muted:#8a90a0;--accent:#1a6bff;
    --accent-bg:rgba(26,107,255,0.08);--r:14px;
  }
  body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);overflow:hidden}
  .wrap{max-width:500px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
  
  .hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
  .back{font-size:22px;cursor:pointer;color:var(--muted)}
  .hdr-title{font-size:14px;font-weight:700}

  .tabs{display:flex;overflow-x:auto;background:var(--surface);border-bottom:2px solid var(--border);flex-shrink:0}
  .tab{padding:12px 16px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}

  .body{flex:1;overflow-y:auto;padding:16px;padding-bottom:60px}
  .sec{display:none}
  .sec.on{display:block}

  .stitle{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;margin-bottom:4px}
  .ssub{font-size:11px;color:var(--muted);margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
  .ctit{font-size:13px;font-weight:700;margin-bottom:6px;display:block}
  .ctxt{font-size:12px;line-height:1.6;color:#444}
  a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>

<div class="wrap">
  <div class="hdr">
    <span class="back" onclick="window.history.back()">←</span>
    <span class="hdr-title" id="ptitle">Kirolorik</span>
  </div>

  <div class="tabs" id="tabsEl">
    </div>

  <div class="body" id="mainContent">
    <div class="sec" id="s-quienes">
      <div class="stitle">Kirolorik</div>
      <div class="ssub">La agenda del deporte amateur local</div>
      <div class="card">
        <span class="ctit">¿Qué es Kirolorik?</span>
        <div class="ctxt">Agenda digital de eventos deportivos en Eibar.</div>
      </div>
    </div>

    <div class="sec" id="s-privacidad">
      <div class="stitle">Privacidad</div>
      <div class="ssub">Última actualización: mayo 2026</div>
      <div class="card">
        <span class="ctit">Responsable</span>
        <div class="ctxt">Proyecto personal en Eibar.</div>
      </div>
    </div>

    <div class="sec" id="s-cookies">
      <div class="stitle">Cookies</div>
      <div class="ssub">Política de cookies</div>
      <div class="card">
        <span class="ctit">Uso</span>
        <div class="ctxt">Solo usamos cookies técnicas de sesión.</div>
      </div>
    </div>

    </div>
</div>

<script>
(function() {
  const TABS = [
    {id:'quienes',    label:'Kirolorik'},
    {id:'privacidad', label:'Privacidad'},
    {id:'cookies',    label:'Cookies'}
  ];

  const tabsContainer = document.getElementById('tabsEl');
  const pageTitle = document.getElementById('ptitle');
  const contentBody = document.getElementById('mainContent');

  // Función para cambiar de pestaña
  function switchTab(tabId) {
    // 1. Quitar 'on' de todas las pestañas y secciones
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    document.querySelectorAll('.sec').forEach(s => s.classList.remove('on'));

    // 2. Activar la pestaña clicada
    const activeTab = document.querySelector(`.tab[data-id="${tabId}"]`);
    const activeSec = document.getElementById('s-' + tabId);

    if (activeTab && activeSec) {
      activeTab.classList.add('on');
      activeSec.classList.add('on');
      
      // Actualizar título de cabecera
      const tabData = TABS.find(t => t.id === tabId);
      pageTitle.textContent = tabData.label;

      // Resetear scroll
      contentBody.scrollTop = 0;
    }
  }

  // Generar las pestañas dinámicamente
  TABS.forEach(tab => {
    const tabBtn = document.createElement('div');
    tabBtn.className = 'tab';
    tabBtn.textContent = tab.label;
    tabBtn.setAttribute('data-id', tab.id);
    
    // El evento de clic directo
    tabBtn.onclick = function() {
      switchTab(tab.id);
    };
    
    tabsContainer.appendChild(tabBtn);
  });

  // Mostrar la primera por defecto al cargar
  switchTab('quienes');

})();
</script>

</body>
</html>
