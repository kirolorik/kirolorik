<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a6bff">
<meta name="description" content="Información legal de Kirolorik: política de privacidad, cookies, RGPD, términos de uso y publicidad.">
<title>Kirolorik · Legal</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Tu CSS se mantiene igual porque es correcto */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f4f6f8;--surface:#fff;--border:#dde1e7;
    --text:#1a1d23;--muted:#8a90a0;--accent:#1a6bff;
    --accent-bg:rgba(26,107,255,0.08);--r:14px;--r2:9px;
  }
  body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);overflow: hidden;}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:500px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
  .hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink: 0;}
  .back{font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
  .hdr-title{font-size:14px;font-weight:700;color:var(--text)}
  .tabs{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-bottom:2px solid var(--border);flex-shrink: 0;}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;flex-shrink:0;transition:color 0.15s;}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .body{flex:1;overflow-y:auto;padding:16px 16px 48px; -webkit-overflow-scrolling: touch;}
  .sec{display:none}
  .sec.on{display:block}
  .stitle{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--text);margin-bottom:4px}
  .ssub{font-size:11px;color:var(--muted);margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
  .chead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .cico{font-size:20px;flex-shrink:0;width:28px;text-align:center}
  .ctit{font-size:13px;font-weight:700;color:var(--text)}
  .ctxt{font-size:12px;color:var(--text);line-height:1.65}
  .ctxt ul{padding-left:16px;margin-top:8px}
  .ctxt li{margin-bottom:4px}
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--accent-bg);border:1px solid var(--accent);border-radius:20px;padding:8px 14px;margin-top:8px;font-size:12px;font-weight:600;color:var(--accent);}
</style>
</head>
<body>

<div class="wrap">
  <div class="hdr">
    <span class="back" onclick="history.back()">←</span>
    <span class="hdr-title" id="ptitle">Kirolorik</span>
  </div>

  <div class="tabs" id="tabsEl"></div>

  <div class="body" id="scrollBody">
    <div class="sec" id="s-quienes">
      <div class="stitle">Kirolorik</div>
      <div class="ssub">La agenda del deporte amateur local · Eibar</div>
      <div class="card"><div class="chead"><span class="cico">🏟️</span><span class="ctit">¿Qué es Kirolorik?</span></div><div class="ctxt">Kirolorik es una agenda digital de eventos deportivos locales.</div></div>
      </div>

    <div class="sec" id="s-privacidad">
      <div class="stitle">Privacidad</div>
      <div class="ssub">Política de privacidad · Última actualización: mayo 2026</div>
      <div class="card"><div class="chead"><span class="cico">🏢</span><span class="ctit">Responsable del tratamiento</span></div><div class="ctxt">Kirolorik es un proyecto personal con sede en Eibar.</div></div>
    </div>
    
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const TABS = [
    {id:'quienes',    label:'Kirolorik'},
    {id:'privacidad', label:'Privacidad'},
    {id:'cookies',    label:'Cookies'},
    {id:'rgpd',       label:'RGPD'},
    {id:'terminos',   label:'Términos'},
    {id:'publicidad', label:'Publicidad'},
  ];

  const tabsEl = document.getElementById('tabsEl');
  const scrollBody = document.getElementById('scrollBody');

  // 1. Generar pestañas
  TABS.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tab';
    el.textContent = t.label;
    el.dataset.id = t.id;
    el.onclick = () => showTab(t.id);
    tabsEl.appendChild(el);
  });

  function showTab(id) {
    // Validar si el ID existe
    const exists = TABS.some(t => t.id === id);
    if (!exists) id = TABS[0].id;

    // Actualizar clases de secciones
    document.querySelectorAll('.sec').forEach(s => s.classList.remove('on'));
    const targetSec = document.getElementById('s-' + id);
    if (targetSec) targetSec.classList.add('on');

    // Actualizar clases de tabs
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    const targetTab = tabsEl.querySelector(`[data-id="${id}"]`);
    if (targetTab) {
        targetTab.classList.add('on');
        // Scroll automático suave de la pestaña si queda oculta
        targetTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    // Actualizar título e historial (opcional para navegación con botón atrás)
    const found = TABS.find(t => t.id === id);
    document.getElementById('ptitle').textContent = found ? found.label : 'Legal';
    
    // Resetear scroll del contenido
    scrollBody.scrollTop = 0;
  }

  // 2. Carga inicial basada en Hash
  const currentHash = window.location.hash.replace('#', '');
  showTab(currentHash || 'quienes');

  // 3. Escuchar cambios de hash (por si el usuario navega atrás/adelante)
  window.addEventListener('hashchange', () => {
    showTab(window.location.hash.replace('#', ''));
  });
});
</script>

</body>
</html>
